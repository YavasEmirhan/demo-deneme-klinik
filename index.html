<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Örnek Diş Kliniği Demosu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Nunito:wght@700;800&display=swap">
<style>
/* Tek, açık tema: nane zemin, beyaz yüzeyler, su yeşili marka, tereyağı sarısı vurgu */
:root{
  color-scheme:light;
  --brand:#087F7B;
  --bg:#E6F4F0; --mint:#E3F5F0; --mint-2:#CFEDE5; --surface:#FFFFFF; --surface-2:#F4FAF8;
  --ink:#0F2E3A; --ink-2:#46626B; --ink-3:#7A9399; --line:#D3E6E1;
  --butter:#FFE8A3; --butter-2:#FFF4D1; --butter-ink:#6A4C00;
  --frame:#15323C;
  --ok:#157A3E; --ok-soft:#DDF5E6; --warn:#A65A06; --warn-soft:#FFF0D6; --bad:#B42318; --bad-soft:#FDE4E1;
  --info:#1F56C9; --info-soft:#E1EAFC; --muted-soft:#E9F0EE;
  --brand-text:var(--brand);
  --brand-soft:color-mix(in srgb, var(--brand) 13%, #fff);
  --brand-softer:color-mix(in srgb, var(--brand) 6%, #fff);
  --brand-deep:color-mix(in srgb, var(--brand) 78%, #0F2E3A);
  --shadow:0 1px 2px rgba(15,46,58,.05), 0 12px 32px rgba(8,90,86,.10);
  --shadow-lg:0 2px 4px rgba(15,46,58,.05), 0 24px 60px rgba(8,90,86,.16);
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display:"Gabarito", "Figtree", system-ui, sans-serif;
  --s-display:var(--display);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{font-family:var(--body);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- demo shell ---------- */
.shell{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bar-title{display:flex;flex-direction:column;gap:1px;margin-right:auto;min-width:0}
.bar-title b{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:-.01em}
.bar-title span{color:var(--ink-2);font-size:13px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink-2);position:relative;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.seg .dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13px;color:var(--ink-2)}
.ghost:hover{color:var(--ink);border-color:var(--ink-3)}
body[data-mode="panel"] #device-seg{display:none}
body[data-mode="site"] #view-panel,body[data-mode="panel"] #view-site{display:none}

/* site frame: desktop browser or phone */
.site-frame{position:relative;background:var(--surface);box-shadow:var(--shadow-lg)}
.site-frame[data-device="desktop"]{max-width:1240px;margin-inline:auto;border:1px solid var(--line);border-radius:16px;overflow:clip}
.browser{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.browser i{width:11px;height:11px;border-radius:50%;background:var(--mint-2);display:inline-block}
.browser .dots{display:flex;gap:6px}
.browser .url{flex:1;max-width:420px;margin-inline:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-size:12.5px;color:var(--ink-2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.browser .url b{color:var(--ink);font-weight:600}
.site-frame[data-device="mobile"]{width:390px;max-width:100%;height:min(812px, calc(100vh - 110px));min-height:560px;margin-inline:auto;border:10px solid var(--frame);border-radius:44px;overflow:hidden}
.site-frame[data-device="mobile"] .browser{display:none}
.site-frame[data-device="mobile"] .site{height:100%;overflow-y:auto;overscroll-behavior:contain}
.site{background:var(--surface);container-type:inline-size;container-name:site}
.sheet-scrim{position:fixed;inset:0;z-index:50;background:rgba(15,46,58,.42);display:grid;place-items:center;padding:16px}
.site-frame[data-device="mobile"] .sheet-scrim{position:absolute;padding:0;background:transparent}
.sheet{width:min(460px,100%);height:min(740px,calc(100vh - 32px));background:var(--surface);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg);animation:up .22s ease-out}
.site-frame[data-device="mobile"] .sheet{width:100%;height:100%;border-radius:0;box-shadow:none}
@media (max-width:700px){
  #device-seg{display:none!important}
  .site-frame[data-device]{width:auto;height:auto;min-height:0;border:1px solid var(--line);border-radius:16px}
  .site-frame[data-device] .browser{display:none}
  .site-frame[data-device] .site{height:auto;overflow:visible}
  .site-frame[data-device] .sheet-scrim{position:fixed;padding:0;background:transparent}
  .site-frame[data-device] .sheet{width:100%;height:100%;border-radius:0}
}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(21,122,62,.45)}70%{box-shadow:0 0 0 7px rgba(21,122,62,0)}100%{box-shadow:0 0 0 0 rgba(21,122,62,0)}}
@media (prefers-reduced-motion:reduce){.sheet,.toast{animation:none}.flash{animation:none!important}.live i{animation:none!important}}

/* ---------- patient site ---------- */
.s-in{max-width:1080px;margin-inline:auto}
.s-strip{background:var(--brand-deep);color:#E7F7F3;font-size:12.5px;padding:7px 18px}
.s-strip .s-in{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.s-strip b{color:#fff;font-weight:600}
.s-strip .s-strip-phone{display:none}
.s-head{position:sticky;top:0;z-index:5;background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 18px}
.s-head .s-in{display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--s-display);font-weight:700;font-size:18px;letter-spacing:-.01em;min-width:0;margin-right:auto}
.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo .mark{flex:none;width:36px;height:36px;border-radius:12px 12px 16px 16px;background:var(--brand);display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.logo .mark svg{width:20px;height:20px;fill:#fff}
.s-nav{display:none;gap:2px}
.s-nav button{border:0;background:none;padding:8px 12px;border-radius:999px;font-weight:600;color:var(--ink-2)}
.s-nav button:hover{color:var(--ink);background:var(--mint)}
.btn{border:0;border-radius:999px;background:var(--brand);color:#fff;font-weight:700;padding:10px 18px;font-size:14px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 6px 16px color-mix(in srgb, var(--brand) 28%, transparent)}
.btn:hover{filter:brightness(1.07)}
.btn.lg{padding:15px 24px;font-size:15.5px}
.btn.full{width:100%}
.btn.sec{background:var(--brand-soft);color:var(--brand-deep);box-shadow:none}
.btn.line{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.line svg{width:18px;height:18px;fill:#1FA855}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

/* hero: nane zemin, yumuşak su yeşili hale, altta diş sırası gibi dalgalı kenar */
.s-hero{position:relative;padding:30px 18px 48px;background:
  radial-gradient(70% 90% at 95% 0%, color-mix(in srgb, var(--brand) 16%, transparent), transparent 70%),
  radial-gradient(50% 60% at 0% 100%, var(--butter-2), transparent 70%),
  var(--mint)}
.s-hero::after{content:"";position:absolute;left:0;right:0;bottom:-15px;height:16px;
  background:radial-gradient(circle at 16px 0, var(--mint) 13px, transparent 14px) 0 0 / 32px 16px repeat-x;z-index:1}
.s-hero-in{display:grid;gap:30px;align-items:start}
.where{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--mint-2);border-radius:999px;padding:5px 12px 5px 8px;font-size:13px;font-weight:600;color:var(--brand-deep);margin:0 0 16px}
.where svg{width:16px;height:16px;fill:var(--brand)}
.s-hero h1{font-family:var(--s-display);font-size:34px;line-height:1.04;letter-spacing:-.025em;font-weight:800;margin-bottom:14px;color:var(--ink)}
.s-hero p.sub{color:var(--ink-2);margin:0 0 22px;font-size:16px;line-height:1.55;max-width:46ch}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.cta .btn{flex:1 1 auto}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;padding:0;list-style:none}
.facts li{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.facts li b{color:var(--ink);font-weight:600}
.facts svg{width:18px;height:18px;flex:none;stroke:var(--brand);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* randevu kartı: kliniklerin verdiği kâğıt kart gibi, koçanlı */
.card-wrap{position:relative}
.quick{position:relative;background:var(--surface);border-radius:22px;box-shadow:var(--shadow-lg);overflow:visible}
.quick-top{background:var(--brand);color:#fff;border-radius:22px 22px 0 0;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.quick-top b{font-family:var(--s-display);font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.quick-top b svg{width:18px;height:18px;fill:#fff;opacity:.9}
.live{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;font-weight:600}
.live i{width:7px;height:7px;border-radius:50%;background:#7CF0B0;animation:pulse 2s infinite}
.quick-body{padding:4px 18px 6px}
.qrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow b{display:block;font-size:14.5px;font-weight:700}
.qrow small{color:var(--ink-2);font-size:12.5px}
.arch-sm{width:44px;height:50px;border-radius:22px 22px 10px 10px;display:grid;place-items:center;font-family:var(--s-display);font-weight:700;font-size:15px}
.qslot{border:1.5px solid color-mix(in srgb, var(--brand) 45%, #fff);color:var(--brand-deep);background:var(--surface);border-radius:14px;padding:6px 12px;font-weight:800;font-size:15px;text-align:center;line-height:1.15;font-family:var(--s-display);min-width:74px}
.qslot span{display:block;font-family:var(--body);font-weight:600;font-size:11.5px;color:var(--ink-2)}
.qslot.today{background:var(--butter);border-color:#F2CF68;color:var(--ink)}
.qslot.today span{color:var(--butter-ink)}
.qslot:hover{border-color:var(--brand);transform:translateY(-1px)}
.perf{position:relative;height:0;border-top:2px dashed var(--line);margin:4px 0 0}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--mint)}
.perf::before{left:-11px}.perf::after{right:-11px}
.stub{padding:12px 18px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.stub b{color:var(--ink);font-weight:700}

.s-sec{position:relative;padding:36px 18px;background:var(--surface)}
.s-sec.tint{background:var(--surface-2)}
.s-sec h2{font-family:var(--s-display);font-size:26px;letter-spacing:-.02em;font-weight:800;margin-bottom:6px}
.s-sec p.lead{color:var(--ink-2);margin:0 0 22px;font-size:15px;max-width:58ch}
.svc{display:grid;gap:18px 28px}
.svc > div{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:start}
.svc .ic{width:48px;height:48px;border-radius:16px;background:var(--mint);display:grid;place-items:center}
.svc .ic svg{width:24px;height:24px;stroke:var(--brand);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.svc b{display:block;font-size:16px;font-weight:700;margin:2px 0 3px}
.svc span{color:var(--ink-2);font-size:14px}

.how{display:grid;gap:14px;counter-reset:how;padding:0;margin:0;list-style:none}
.how li{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.how li::before{counter-increment:how;content:counter(how);width:52px;height:52px;border-radius:50%;background:var(--butter);color:var(--ink);display:grid;place-items:center;font-family:var(--s-display);font-weight:800;font-size:22px}
.how b{display:block;font-size:15.5px}
.how span{color:var(--ink-2);font-size:13.5px}

.docs{display:grid;gap:14px}
.doc{display:grid;grid-template-columns:76px 1fr;gap:16px;padding:16px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}
.portrait{width:76px;height:92px;border-radius:38px 38px 14px 14px;display:grid;place-items:center;font-family:var(--s-display);font-weight:800;font-size:24px;position:relative;overflow:hidden}
.portrait::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.35))}
.doc h3{font-size:17px;font-weight:700;font-family:var(--s-display);letter-spacing:-.01em}
.doc .spec{display:inline-block;margin-top:4px;background:var(--mint);color:var(--brand-deep);font-weight:600;font-size:12.5px;border-radius:999px;padding:2px 10px}
.doc p{margin:8px 0 12px;color:var(--ink-2);font-size:13.5px}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;flex:none}
.av.sm{width:38px;height:38px;font-size:13px}

.s-contact{display:grid;gap:18px}
.hours{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--surface);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.hours td{padding:12px 16px;border-bottom:1px solid var(--line)}
.hours tr:last-child td{border-bottom:0}
.hours td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.hours tr.is-today td{background:var(--butter-2)}
.hours tr.is-today td:first-child::after{content:"Bugün";margin-left:8px;font-size:11.5px;font-weight:700;background:var(--butter);color:var(--butter-ink);border-radius:999px;padding:1px 8px}
.contact{display:grid;gap:0;background:var(--mint);border-radius:18px;padding:6px 16px}
.contact div{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;padding:12px 0;border-bottom:1px solid var(--mint-2)}
.contact div:last-child{border-bottom:0}
.contact small{color:var(--ink-2);font-weight:600;font-size:13.5px}
.contact a{color:var(--brand-deep);font-weight:700;text-decoration:none}
.contact a:hover{text-decoration:underline}
.s-foot{padding:24px 18px;background:var(--mint);color:var(--ink-2);font-size:12.5px;border-top:1px solid var(--mint-2)}
.s-foot .s-in{display:grid;gap:6px}
.link{background:none;border:0;padding:0;color:var(--brand-deep);font-weight:700;text-decoration:underline;text-underline-offset:2px}

@container site (min-width: 760px){
  .s-strip{padding:7px 28px}
  .s-strip .s-strip-phone{display:inline}
  .s-head{padding:14px 28px}
  .s-nav{display:flex}
  .s-hero{padding:64px 28px 84px}
  .s-hero-in{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px;align-items:center}
  .s-hero h1{font-size:56px}
  .s-hero p.sub{font-size:17.5px}
  .cta .btn{flex:0 0 auto}
  .quick{transform:rotate(-1.6deg)}
  .card-wrap::before{content:"";position:absolute;inset:14px -10px -12px 18px;border-radius:24px;background:var(--butter);transform:rotate(2.2deg);z-index:0}
  .card-wrap .quick{z-index:1}
  .s-sec{padding:60px 28px}
  .s-sec h2{font-size:34px}
  .svc{grid-template-columns:repeat(3,1fr);gap:30px 36px}
  .how{grid-template-columns:repeat(3,1fr);gap:18px}
  .how li{grid-template-columns:1fr;justify-items:start;padding:22px}
  .docs{grid-template-columns:repeat(3,1fr);gap:18px}
  .doc{grid-template-columns:1fr;padding:18px}
  .portrait{width:100%;height:170px;border-radius:999px 999px 18px 18px;font-size:44px}
  .s-contact{grid-template-columns:1fr 1fr;gap:28px}
  .s-foot{padding:28px}
}

/* ---------- nihai sürüm: ağrı haritası, kayan bant, ilk ziyaret ---------- */
@keyframes popin{0%{opacity:0;scale:.3}100%{opacity:1;scale:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes throb{0%,100%{scale:1}50%{scale:1.035}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes cardin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.s-hero.pm-hero{padding-bottom:56px}
.pm-grid{display:grid;gap:20px;grid-template-areas:"intro" "mouth" "ctrl"}
.pm-intro{grid-area:intro}
.pm-mouth{grid-area:mouth;display:flex;justify-content:center}
.pm-ctrl{grid-area:ctrl;display:grid;gap:16px}
.zones{display:flex;flex-wrap:wrap;gap:6px}
.zone{border:0;border-radius:999px;padding:9px 14px;font-weight:700;font-size:13.5px;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--mint-2);transition:background .2s,color .2s}
.zone:hover{box-shadow:inset 0 0 0 1.5px var(--brand)}
.zone[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.pm-label{font-weight:700;font-size:14px;color:var(--ink-2);margin:0 0 8px}
.scale-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.scale-h b{font-family:var(--s-display);font-weight:800;font-size:34px;line-height:1;transition:color .3s}
.scale-h span{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.segs{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px}
.lvl{height:34px;border:0;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:12px;padding:0;transition:transform .15s}
.lvl:hover{transform:translateY(-2px)}
.scale-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:6px}
.pm-card{background:var(--surface);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);display:grid;gap:8px;animation:cardin .3s ease-out}
.pm-card.urgent{box-shadow:0 0 0 2px #D14B61, var(--shadow)}
.pm-card b.t{font-family:var(--s-display);font-size:18px;font-weight:700}
.pm-card p{margin:0;font-size:14px;line-height:1.5;color:var(--ink-2)}
.pm-card .row2{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}
.pm-card .row2 > div{margin-right:auto}
.pm-card .row2 b{display:block;font-size:14.5px}
.pm-card .row2 small{color:var(--ink-2);font-size:12.5px}
.pm-note{font-size:12px;color:var(--ink-3)}
.mouth{position:relative;width:320px;height:320px;animation:float 6s ease-in-out infinite}
.mouth-in{position:absolute;left:0;top:0;width:520px;height:520px;transform-origin:0 0;transform:scale(.6154)}
.mouth .glow{position:absolute;inset:0;border-radius:50%;transition:opacity .4s}
.mouth .beat{position:absolute;inset:0;animation:throb var(--sp,2s) ease-in-out infinite}
.mouth svg{position:absolute;inset:0}
.mouth .tooth{position:absolute;padding:0;border:0;cursor:pointer;transition:background .3s, box-shadow .3s}
.mouth .tooth.pop{opacity:0;animation:popin .4s cubic-bezier(.3,.8,.3,1.3) forwards}
.mouth .hint{position:absolute;left:0;right:0;top:248px;text-align:center;font-family:var(--s-display);font-weight:600;font-size:15px;color:#B07A8C;pointer-events:none}

.band{background:var(--brand-deep);color:#fff;overflow:hidden;padding:15px 0}
.band .track{display:flex;width:max-content;gap:28px;align-items:center;animation:marquee 40s linear infinite}
.band:hover .track{animation-play-state:paused}
.band span{font-family:var(--s-display);font-weight:600;font-size:18px;white-space:nowrap}
.band svg{width:16px;height:16px;fill:var(--butter);flex:none}

.doc .next{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-2px 0 12px}
.doc .next small{color:var(--ink-2);font-size:12.5px;font-weight:600}

.visit{display:grid;gap:28px}
.visit h3{font-family:var(--s-display);font-weight:700;font-size:20px;margin:0 0 12px}
.vsteps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.vstep{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;border-radius:16px;padding:10px 14px;border:1.5px solid transparent;transition:background .5s,border-color .5s,transform .5s}
.vstep .n{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:var(--brand-deep);font-family:var(--s-display);font-weight:800;font-size:17px;transition:background .5s,color .5s}
.vstep b{display:block;font-size:15px}
.vstep span{font-size:13.5px;color:var(--ink-2)}
.vstep small{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.vstep.on{background:var(--surface);border-color:var(--mint-2);transform:translateX(4px)}
.vstep.on .n{background:var(--brand);color:#fff}
.faq{display:grid;gap:8px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 16px}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;font-weight:700;font-size:15px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:20px;color:var(--brand);font-weight:600}
.faq details[open] summary::after{content:"−"}
.faq details p{margin:0 0 14px;font-size:14px;line-height:1.55;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){.mouth,.mouth .beat,.band .track{animation:none}.mouth .tooth.pop{animation:none;opacity:1}.pm-card{animation:none}}

@container site (min-width: 760px){
  .pm-grid{grid-template-columns:minmax(0,1fr) 520px;grid-template-areas:"intro mouth" "ctrl mouth";column-gap:48px;row-gap:22px;align-items:start}
  .pm-mouth{align-self:center}
  .mouth{width:520px;height:520px}
  .mouth-in{transform:none}
  .visit{grid-template-columns:1fr 1fr;gap:40px}
}

@container site (min-width: 760px){ .pm-hero h1{font-size:48px} }

.mouth.m3d{animation:none}
.m3-canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.m3-canvas:active{cursor:grabbing}
.m3-tip{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:12.5px;font-weight:600;color:var(--ink-2);pointer-events:none}
/* booking sheet */
.sh-head{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;padding:10px;background:var(--mint);border-bottom:1px solid var(--mint-2)}
.sh-head b{text-align:center;font-size:15px;font-family:var(--s-display);font-weight:700}
.icon-btn{width:36px;height:36px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2);font-size:20px;line-height:1}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px 16px 4px;margin:0;list-style:none}
.steps li{font-size:11px;font-weight:700;color:var(--ink-3);display:grid;gap:5px}
.steps li::before{content:"";height:4px;border-radius:4px;background:var(--line)}
.steps li.on{color:var(--ink)}
.steps li.on::before,.steps li.past::before{background:var(--brand)}
.sh-body{flex:1;overflow-y:auto;padding:14px 16px 20px}
.sh-body h3{font-family:var(--s-display);font-size:20px;font-weight:700;letter-spacing:-.01em;margin-bottom:12px}
.pick{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;padding:12px;border:1.5px solid var(--line);border-radius:18px;background:var(--surface)}
.opt:hover{border-color:var(--ink-3)}
.opt.sel{border-color:var(--brand);background:var(--brand-softer)}
.opt b{display:block;font-size:14.5px}
.opt small{color:var(--ink-2);font-size:12.5px}
.opt .chev{color:var(--ink-3);font-size:18px}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:11px;font-weight:700;color:var(--ink-3);text-align:center;padding-bottom:2px}
.day{aspect-ratio:1/1.05;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);display:grid;place-content:center;text-align:center;padding:0}
.day b{font-size:15px;line-height:1.1}
.day i{font-style:normal;font-size:10px;color:var(--ok);font-weight:700}
.day:disabled{background:var(--surface-2);border-color:transparent;color:var(--ink-3);cursor:default}
.day:disabled i{color:var(--ink-3)}
.day.today b{text-decoration:underline;text-underline-offset:3px}
.day.sel{border-color:var(--brand);background:var(--brand);color:#fff}
.day.sel i{color:#fff}
.slot-g{margin-bottom:14px}
.slot-g small{display:block;font-weight:700;color:var(--ink-3);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{padding:10px 0;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums}
.slot:hover:not(:disabled){border-color:var(--brand)}
.slot.sel{background:var(--brand);border-color:var(--brand);color:#fff}
.slot:disabled{background:var(--surface-2);border-color:transparent;color:var(--ink-3);text-decoration:line-through;cursor:default}
.ctx{background:var(--butter-2);border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--ink-2)}
.ctx b{color:var(--ink)}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-weight:700;font-size:13px}
.field label small{font-weight:600;color:var(--ink-3)}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:15px}
.field textarea{resize:vertical;min-height:64px;font-size:14px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand)}
.hint{color:var(--ink-3);font-size:12px}
.check{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;font-size:12.5px;color:var(--ink-2);margin:4px 0 14px}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--brand)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-weight:700;font-size:13px;margin-bottom:12px}
.done{text-align:center;padding-top:14px}
.done .ok-ic{width:62px;height:62px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px;font-size:30px;font-weight:800}
.done h3{font-size:21px}
.sum{margin:16px 0;text-align:left;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.sum div:last-child{border-bottom:0}
.sum small{color:var(--ink-3);font-weight:600}
.sum b{text-align:right}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px;text-align:left;margin:0 0 14px}
.stack{display:grid;gap:8px}
.kvkk-text{font-size:13px;color:var(--ink-2);display:grid;gap:10px}
.kvkk-text p{margin:0}

/* ---------- panel ---------- */
.panel{max-width:1240px;margin-inline:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.p-top{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.p-id{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.p-id .mark{flex:none;width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center}
.p-id .mark svg{width:19px;height:19px;fill:#fff}
.p-id b{display:block;font-size:16px;font-weight:700;font-family:var(--display)}
.p-id small{color:var(--ink-3);font-size:12px}
.p-nav{display:flex;gap:2px;padding:6px 10px;border-bottom:1px solid var(--mint-2);overflow-x:auto;background:var(--mint)}
.p-nav button{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--ink-2);white-space:nowrap}
.p-nav button:hover{color:var(--ink)}
.p-nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.p-nav .cnt{display:inline-block;margin-left:5px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--brand);color:#fff;font-size:11px;line-height:18px}
.p-body{padding:18px 20px 24px}
.p-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.p-head h2{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.nav-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:16px;color:var(--ink-2)}
.nav-btn:hover:not(:disabled){color:var(--ink);border-color:var(--ink-3)}
.nav-btn:disabled{opacity:.4;cursor:default}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.stat{display:flex;align-items:baseline;gap:6px;padding:7px 12px;border-radius:999px;background:var(--mint);font-size:12.5px;color:var(--ink-2);font-weight:600}
.stat b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.list{display:grid;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.now{box-shadow:inset 3px 0 0 var(--brand)}
.row.is-cancelled .r-name,.row.is-cancelled .r-time b{text-decoration:line-through;color:var(--ink-3)}
.r-time b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.r-time small{color:var(--ink-3);font-variant-numeric:tabular-nums}
.r-name{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.r-sub{color:var(--ink-2);font-size:12.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ddot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.src{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.r-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pending{background:var(--info-soft);color:var(--info)}
.st-confirmed{background:var(--brand-soft);color:var(--brand-text)}
.st-attended{background:var(--ok-soft);color:var(--ok)}
.st-no_show{background:var(--warn-soft);color:var(--warn)}
.st-cancelled{background:var(--muted-soft);color:var(--ink-3)}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700;color:var(--ink-2);text-decoration:none}
.mini:hover{color:var(--ink);border-color:var(--ink-3)}
.mini.ok{color:var(--ok)} .mini.warn{color:var(--warn)} .mini.bad{color:var(--bad)} .mini.pri{color:var(--brand-text)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:14px}
.flash{animation:flash 2.6s ease-out}
@keyframes flash{0%,30%{background:var(--brand-soft)}100%{background:var(--surface)}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface-2)}
.week-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.week{display:grid;grid-template-columns:repeat(6,minmax(128px,1fr));min-width:780px}
.wcol{border-right:1px solid var(--line);min-height:320px}
.wcol:last-child{border-right:0}
.wcol.today .wh{background:var(--butter)}
.wh{padding:9px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;background:var(--surface-2)}
.wh b{font-size:13px}
.wh small{color:var(--ink-3);font-weight:700;font-size:11.5px}
.wbody{padding:6px;display:grid;gap:5px;align-content:start}
.wi{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 8px;font-size:12px;display:grid;gap:1px}
.wi:hover{border-color:var(--ink-3)}
.wi .t{font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.wi .n{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wi.off{background:var(--surface-2);border-style:dashed;color:var(--ink-3)}
.wi.cx{opacity:.55}.wi.cx .n{text-decoration:line-through}
.wi.st-attended-b .t::after{content:"✓";color:var(--ok);margin-left:auto}
.wi.st-no_show-b .t::after{content:"!";color:var(--warn);margin-left:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;align-content:start}
.card-h{display:flex;gap:10px;align-items:center}
.card-h b{display:block}
.card-h small{color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;margin:0}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.inline select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.inline input[type=checkbox]{accent-color:var(--brand);width:16px;height:16px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;background:var(--surface-2)}
.form-grid .field{margin:0}
.form-grid .field input,.form-grid .field select{font-size:14px;padding:9px 10px}
.explain{color:var(--ink-2);font-size:13px;margin:-6px 0 14px;max-width:72ch}
.mail{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.mail:hover{background:var(--surface-2)}
.mail:last-child{border-bottom:0}
.mail .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;background:var(--surface-2)}
.mail b{display:block;font-size:13.5px}
.mail small{color:var(--ink-2);font-size:12.5px}
.set{display:grid;gap:16px;max-width:600px}
.set .field{margin:0}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:34px;height:34px;border-radius:10px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.swatches input[type=color]{width:44px;height:34px;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.fonts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fontopt{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px;text-align:left}
.fontopt b{display:block;font-size:19px;line-height:1.2}
.fontopt small{color:var(--ink-3);font-weight:600}
.fontopt[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.addon{display:grid;gap:8px}
.addon div{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;font-size:13px}
.addon span{color:var(--ink-3);font-weight:600}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,15,18,.45);z-index:60;display:flex;justify-content:flex-end}
.drawer{width:min(440px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.dr-head b{font-size:15px}
.dr-body{flex:1;overflow-y:auto;padding:16px;display:grid;gap:14px;align-content:start;grid-auto-rows:max-content}
.dr-body .sum{margin:0}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .mini{padding:8px 12px;font-size:13px}
.copy{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copy code{font-family:var(--body);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;user-select:all}

/* e-mail preview (always light, like a real inbox) */
.em{background:#F2F5F6;border-radius:14px;padding:14px;color:#10272E;font-family:var(--body)}
.em-meta{font-size:12px;color:#51666C;margin-bottom:10px;display:grid;gap:2px}
.em-meta b{color:#10272E}
.em-card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #DDE6E8}
.em-top{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px}
.em-top .mk{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.em-top .mk svg{width:16px;height:16px;fill:#fff}
.em-body{padding:18px 16px;display:grid;gap:12px;font-size:14px;line-height:1.55}
.em-body h4{margin:0;font-size:19px;letter-spacing:-.01em;line-height:1.25}
.em-body p{margin:0;color:#3D5258}
.em-box{background:#F4F8F9;border-radius:10px;padding:12px;display:grid;gap:4px;font-size:13.5px}
.em-box b{color:#10272E}
.em-btn{display:block;text-align:center;background:var(--brand);color:#fff;border-radius:10px;padding:12px;font-weight:800;text-decoration:none}
.em-btn.alt{background:#fff;color:#10272E;border:1.5px solid #DDE6E8}
.em-foot{padding:12px 16px;border-top:1px solid #E6EDEF;font-size:11.5px;color:#7A8F95}
.stars{color:#F59E0B;font-size:22px;letter-spacing:4px;text-align:center}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;display:grid;gap:8px;width:min(460px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--surface);border-radius:12px;padding:11px 14px;font-weight:600;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:var(--shadow);animation:up .2s ease-out}
.toast button{border:0;background:transparent;color:inherit;font-weight:800;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}

@media (max-width:560px){
  .row{grid-template-columns:52px minmax(0,1fr)}
  .r-right{grid-column:1 / -1;justify-content:flex-start}
  .p-body{padding:14px}
  .mail{grid-template-columns:auto minmax(0,1fr)}
  .mail .pill{grid-column:2;justify-self:start}
  .fonts{grid-template-columns:1fr}
}
/* ---------- panel: hastalar (mini CRM) ve aylık rapor ---------- */
.p-search{flex:1 1 200px;max-width:300px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px}
.p-search:focus{outline:none;border-color:var(--brand)}
.chip .cnum{font-variant-numeric:tabular-nums;color:var(--ink-3)}
.chip[aria-pressed="true"] .cnum{color:var(--ink)}
.row.pt{grid-template-columns:64px minmax(0,1fr) auto}
.row.pt .av{justify-self:start}
.row.done{opacity:.62}
.chev{color:var(--ink-3);font-size:20px;line-height:1}
.tag{display:inline-flex;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;white-space:nowrap}
.tg-new{background:var(--info-soft);color:var(--info)}
.tg-reg{background:var(--ok-soft);color:var(--ok)}
.tg-lap{background:var(--warn-soft);color:var(--warn)}
.why{color:var(--ink);font-weight:600}
.hist{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hist button{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:8px 10px;font-size:12.5px}
.hist button:last-child{border-bottom:0}
.hist button:hover{background:var(--surface-2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);display:grid;gap:2px}
.kpi small{color:var(--ink-2);font-weight:600;font-size:12.5px}
.kpi b{font-family:var(--display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:12px;color:var(--ink-3)}
.rgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.rbox{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface)}
.rbox h3{font-size:14.5px;margin:0 0 12px;font-weight:700}
.hbar{display:grid;grid-template-columns:92px minmax(0,1fr) 84px;gap:10px;align-items:center;font-size:13px;margin-bottom:10px}
.hbar .tr{height:10px;background:var(--muted-soft);border-radius:999px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--brand);border-radius:0 4px 4px 0}
.hbar b{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.trend{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:172px}
.trend .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.trend .c i{width:100%;max-width:36px;background:var(--brand);border-radius:4px 4px 0 0}
.trend .c.cur i{opacity:.45}
.trend .c b{font-size:12px;font-variant-numeric:tabular-nums}
.trend .c small{font-size:11.5px;color:var(--ink-2)}
.ptable{width:100%;border-collapse:collapse;font-size:13px}
.ptable th,.ptable td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.ptable tr:last-child td{border-bottom:0}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.ptable th{color:var(--ink-2);font-weight:600;font-size:12px}

/* ---------- WhatsApp asistanı (site içinde) ---------- */
.wa-dock{position:sticky;bottom:0;height:0;z-index:40}
.site-frame[data-device="mobile"] .wa-dock{position:absolute;left:0;right:0;bottom:0}
.wa-fab{position:absolute;right:20px;bottom:20px;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:#128C4A;color:#fff;font-weight:700;font-size:14px;padding:12px 18px;box-shadow:0 10px 26px rgba(8,60,40,.28)}
.wa-fab svg{width:22px;height:22px;fill:#fff}
.wa-fab:hover{filter:brightness(1.08)}
.site-frame[data-device="mobile"] .wa-fab{right:14px;bottom:14px;padding:13px}
.site-frame[data-device="mobile"] .wa-fab span{display:none}
.wa-box{position:fixed;z-index:46;right:max(24px, calc((100vw - 1240px) / 2 + 24px));bottom:24px;width:min(384px, calc(100vw - 32px));height:min(620px, calc(100vh - 48px));background:#F3EFE8;border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;animation:up .22s ease-out}
.site-frame[data-device="mobile"] .wa-box{position:absolute;inset:0;width:auto;height:auto;border-radius:0;border:0}
@media (max-width:700px){
  .site-frame[data-device] .wa-box{position:fixed;inset:0;width:auto;height:auto;border-radius:0;border:0}
  /* Gerçek telefonda düğme ekrana sabitlenir (çerçeve kaydırma kabı olmadığı için yapışkan konum işe yaramaz) */
  .site-frame[data-device] .wa-dock{position:static;height:0}
  .site-frame[data-device] .wa-fab{position:fixed;z-index:45;right:16px;bottom:calc(16px + env(safe-area-inset-bottom, 0px));padding:13px}
  .site-frame[data-device] .wa-fab span{display:none}
  .wa-form input{font-size:16px}  /* iPhone'da yazarken sayfanın yakınlaşmasını önler */
}
.wa-head{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;background:var(--brand-deep);color:#fff}
.wa-head b{display:block;font-size:14.5px;line-height:1.25}
.wa-head small{opacity:.88;font-size:12px}
.wa-head .icon-btn{margin-left:auto;color:#fff}
.wa-head .icon-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.wa-av{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.wa-av svg{width:20px;height:20px;fill:var(--brand)}
.wa-demo{font-size:11.5px;color:var(--butter-ink);background:var(--butter-2);padding:6px 12px;text-align:center}
.wa-msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.wa-m{max-width:86%;display:flex;flex-direction:column;padding:8px 10px 4px;border-radius:12px;font-size:13.5px;line-height:1.45;box-shadow:0 1px 1px rgba(15,46,58,.08);animation:up .18s ease-out}
.wa-m.bot{align-self:flex-start;background:#fff;border-top-left-radius:4px}
.wa-m.me{align-self:flex-end;background:#D7F5CC;border-top-right-radius:4px}
.wa-m small{align-self:flex-end;font-size:10.5px;color:var(--ink-3)}
.wa-m.typing span{display:inline-flex;gap:4px;padding:6px 2px 8px}
.wa-m.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1s infinite}
.wa-m.typing i:nth-child(2){animation-delay:.2s}
.wa-m.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.wa-opts{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-top:1px solid #E4DED3;background:#F8F6F2;max-height:42%;overflow-y:auto}
.wa-opts button{border:1px solid var(--mint-2);background:#fff;color:var(--brand-deep);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;text-align:left}
.wa-opts button:hover{border-color:var(--brand)}
.wa-form{display:flex;gap:8px;padding:10px 12px;background:#F8F6F2;border-top:1px solid #E4DED3}
.wa-form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:14px;background:#fff}
.wa-form input:focus{outline:none;border-color:var(--brand)}
.wa-send{width:42px;height:42px;flex:none;border-radius:50%;border:0;background:var(--brand);display:grid;place-items:center}
.wa-send svg{width:18px;height:18px;fill:#fff}
@media (prefers-reduced-motion:reduce){.wa-box,.wa-m{animation:none}.wa-m.typing i{animation:none;opacity:.6}}
.mail .wa-ic svg{width:18px;height:18px;fill:#128C4A;display:block}
.wa-prev{background:#F3EFE8;border-radius:14px;padding:14px;display:flex;flex-direction:column}

  const patient = source !== 'panel';
  if (patient && !kvkk) return { err: 'KVKK_REQUIRED' };
  name = String(name || '').trim().replace(/\s+/g, ' ');
  if (name.length < 2 || name.length > 80) return { err: 'INVALID_NAME' };
  const p = normPhone(phone); if (!p) return { err: 'INVALID_PHONE' };

  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return { err: 'INVALID_EMAIL' };
  const doc = docById(doctorId);
  const slot = daySlots(doc, ymd(new Date(start)), source === 'panel').find(x => x.s === start);
  if (!slot) return { err: 'SLOT_UNAVAILABLE' };
  if (slot.state === 'taken') return { err: patient ? 'SLOT_TAKEN' : 'OVERLAP' };
  if (slot.state === 'past') return { err: patient ? 'SLOT_UNAVAILABLE' : 'PAST' };
  if (slot.state !== 'free') return { err: 'SLOT_UNAVAILABLE' };
  if (patient && S.appts.filter(a => a.phone === p && ['pending','confirmed'].includes(a.status) && a.start > Date.now()).length >= 2)
    return { err: 'TOO_MANY_BOOKINGS' };
  const now = Date.now();
  const a = { id: uid(), token: uid(), doctorId, start, end: slot.e, name, phone: p, email, note: String(note || '').trim() || null,
    status: patient && !S.clinic.autoConfirm ? 'pending' : 'confirmed', source, createdAt: now,
    kvkkAt: patient ? now : null, attendedAt: null };
  S.appts.push(a);
  const ch = source === 'whatsapp' ? 'wa' : email ? 'mail' : null;
  if (ch) {
    const to = ch === 'wa' ? p : email;

    S.mails.push({ id: uid(), type: 'reminder', channel: ch, apptId: a.id, to, at: Math.max(now, start - S.clinic.reminderHours * 3600000) });
  }

}

  const a = S.appts.find(x => x.id === id); if (!a) return;

  if (status === 'attended') {

/* ------------------------------------------------- hastalar (mini CRM)
   Hasta listesi randevulardan türetilir: kimlik = telefon. Yalnızca iletişim ve randevu bilgisi; sağlık bilgisi yok. */
const DAY = 86400000;
const TAGS = { new: ['Yeni hasta', 'tg-new'], regular: ['Düzenli', 'tg-reg'], lapsed: ['Uzun süredir gelmeyen', 'tg-lap'] };
const SRC = { web: 'Web', panel: 'Telefon', whatsapp: 'WhatsApp' };
const SRC_LONG = { web: 'Web sitesi', panel: 'Telefon (panel)', whatsapp: 'WhatsApp asistanı' };
const fmtShort = ms => { const d = new Date(ms); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}${d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''}`; };
const monthsAgo = ms => Math.max(1, Math.round((Date.now() - ms) / (30.44 * DAY)));
const fmtAgo = ms => { const m = Math.round((Date.now() - ms) / 60000); if (m < 60) return `${Math.max(1, m)} dk önce`; const h = Math.round(m / 60); if (h < 24) return `${h} saat önce`; return `${Math.round(h / 24)} gün önce`; };
const tagHtml = p => p.tags.map(t => `<span class="tag ${TAGS[t][1]}">${TAGS[t][0]}</span>`).join('');

function patients() {
  const now = Date.now(), map = new Map();
  const blank = (phone, name) => ({ phone, name, email: null, list: [], att: 0, ns: 0, cx: 0, first: null, last: null, next: null, lastAt: -1 });
  for (const a of S.appts) {
    let p = map.get(a.phone);
    if (!p) map.set(a.phone, p = blank(a.phone, a.name));
    p.list.push(a);
    if (a.createdAt >= p.lastAt) { p.lastAt = a.createdAt; p.name = a.name; }
    if (a.email) p.email = a.email;
    if (a.status === 'attended') { p.att++; if (!p.last || a.start > p.last) p.last = a.start; }
    else if (a.status === 'no_show') p.ns++;
    else if (a.status === 'cancelled') p.cx++;
    if (a.status !== 'cancelled' && (!p.first || a.start < p.first)) p.first = a.start;
    if (['pending', 'confirmed'].includes(a.status) && a.start > now && (!p.next || a.start < p.next.start)) p.next = a;
  }
  for (const h of S.handoffs || []) if (!h.done && !map.has(h.phone)) map.set(h.phone, blank(h.phone, h.name));
  const out = [...map.values()];
  for (const p of out) {
    p.list.sort((a, b) => b.start - a.start);
    p.recent = p.list.length ? p.list[0].start : 0;
    p.tags = [];
    if (p.first && p.first >= now - 30 * DAY) p.tags.push('new');
    if (p.att >= 5) p.tags.push('regular');
    if (p.last && p.last < now - 180 * DAY && !p.next) p.tags.push('lapsed');
    const ho = (S.handoffs || []).filter(h => h.phone === p.phone && !h.done).sort((a, b) => b.at - a.at)[0];
    const lastPast = p.list.find(a => a.start <= now && a.status !== 'cancelled');
    let why = null, since = 0;
    if (ho) { why = `WhatsApp'tan geri dönüş istedi · ${fmtAgo(ho.at)}`; since = ho.at; }
    else if (!p.next && lastPast && lastPast.status === 'no_show' && lastPast.start > now - 60 * DAY) { why = `Randevusuna gelmedi · ${fmtShort(lastPast.start)}`; since = lastPast.start; }
    else if (p.tags.includes('lapsed')) { why = `Kontrol zamanı geldi · son ziyaret ${monthsAgo(p.last)} ay önce`; since = p.last; }
    const c = (S.contacts || {})[p.phone];
    p.why = why; p.calledAt = c ? c.at : null; p.called = !!(why && c && c.at > since);
  }
  return out;
}
function markCalled(phone) {
  S.contacts = S.contacts || {};
  S.contacts[phone] = { at: Date.now() };
  (S.handoffs || []).forEach(h => { if (h.phone === phone) h.done = true; });
  save();
}
function pPatients() {
  const all = patients();
  const cnt = k => all.filter(p => p.tags.includes(k)).length;
  const F = [['all', 'Tümü', all.length], ['recall', 'Tekrar aranacaklar', all.filter(p => p.why && !p.called).length],
    ['new', 'Yeni', cnt('new')], ['regular', 'Düzenli', cnt('regular')], ['lapsed', 'Uzun süredir gelmeyen', cnt('lapsed')]];
  return `<div class="p-head"><h2>Hastalar</h2>
      <input class="p-search" id="pt-q" type="search" placeholder="İsim veya telefon ara" value="${esc(P.pq)}" aria-label="Hasta ara" data-pq="1">
      <button class="ghost" data-act="exportCsv">CSV indir</button></div>
    <p class="explain">Hasta listesi randevulardan kendiliğinden oluşur. Yalnızca iletişim ve randevu bilgisi tutulur; tedavi veya sağlık bilgisi tutulmaz.</p>
    <div class="chips">${F.map(([k, l, n]) => `<button class="chip" data-act="pf" data-f="${k}" aria-pressed="${P.pf === k}">${l}<span class="cnum">${n}</span></button>`).join('')}</div>
    <div id="pt-list">${ptList(all)}</div>`;
}
function ptList(all) {
  all = all || patients();
  const q = P.pq.trim().toLocaleLowerCase('tr'), qd = q.replace(/\D/g, '').replace(/^0/, '');
  let list = all.filter(p => P.pf === 'all' ? true : P.pf === 'recall' ? !!p.why : p.tags.includes(P.pf));
  if (q) list = list.filter(p => p.name.toLocaleLowerCase('tr').includes(q) || (qd.length >= 3 && p.phone.includes(qd)));
  const wa = p => `<a class="mini" href="https://wa.me/${p.phone.slice(1)}" target="_blank" rel="noopener" data-act="noop">WhatsApp</a>`;
  if (P.pf === 'recall') {
    list.sort((a, b) => (a.called - b.called) || (b.why.startsWith('WhatsApp') - a.why.startsWith('WhatsApp')) || (b.recent - a.recent));

async function exportCsv() {
  const d = ms => ms ? new Date(ms).toLocaleDateString('tr-TR') : '';

    rows.push([p.name, fmtPhone(p.phone), p.email || '', d(p.first), d(p.last), p.next ? `${d(p.next.start)} ${hm(p.next.start)}` : '',

  const cell = v => { v = String(v); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const csv = '\ufeff' + rows.map(r => r.map(cell).join(';')).join('\r\n');
  const name = `hastalar-${ymd(new Date())}.csv`;

  if (dl) {

    catch (e) { if (e && e.code !== 'declined') toast('Dosya bu görünümde indirilemedi.'); }
    return;
  }
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(`${rows.length - 1} hasta "${name}" olarak indirildi. Excel'de açılabilir.`);
}

const ymOf = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const monthRange = ym => { const [y, m] = ym.split('-').map(Number); return [new Date(y, m - 1, 1).getTime(), new Date(y, m, 1).getTime()]; };
const shiftYm = (ym, n) => { const [y, m] = ym.split('-').map(Number); return ymOf(new Date(y, m - 1 + n, 1).getTime()); };
const ymLabel = ym => { const [y, m] = ym.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
function monthStats(ym) {
  const [s, e] = monthRange(ym);
  const inM = S.appts.filter(a => a.start >= s && a.start < e), live = inM.filter(a => a.status !== 'cancelled');
  const c = st => inM.filter(a => a.status === st).length;
  const first = {};
  for (const a of S.appts) if (a.status !== 'cancelled' && (!first[a.phone] || a.start < first[a.phone])) first[a.phone] = a.start;
  const att = c('attended'), ns = c('no_show');
  return { s, e, inM, live, att, ns, cx: c('cancelled'), up: live.filter(a => ['pending', 'confirmed'].includes(a.status)).length,
    nsRate: att + ns ? Math.round(ns / (att + ns) * 100) : null,
    newP: Object.values(first).filter(t => t >= s && t < e).length,
    reviews: inM.filter(a => a.status === 'attended' && (a.email || a.source === 'whatsapp')).length };
}
function pReport() {
  const cur = ymOf(Date.now()), minYm = ymOf(Math.min(...S.appts.map(a => a.start)));
  const m = monthStats(P.rm), ongoing = P.rm === cur;
  const prev = monthStats(shiftYm(P.rm, -1));
  const delta = (a, b) => b ? (a >= b ? `+${a - b}` : `${a - b}`) + ' geçen aya göre' : '';
  const ch = [['web', 'Web sitesi'], ['whatsapp', 'WhatsApp'], ['panel', 'Telefon']].map(([k, l]) => [l, m.live.filter(a => a.source === k).length]);
  const chMax = Math.max(1, ...ch.map(x => x[1])), chTot = ch.reduce((t, x) => t + x[1], 0) || 1;
  const trend = []; for (let i = 5; i >= 0; i--) { const ym = shiftYm(P.rm, -i); trend.push([ym, monthStats(ym).live.length]); }
  const tMax = Math.max(1, ...trend.map(x => x[1]));
  const docs = S.doctors.map(d => { const L = m.inM.filter(a => a.doctorId === d.id); const at2 = L.filter(a => a.status === 'attended').length, ns2 = L.filter(a => a.status === 'no_show').length;
    return `<tr><td><span class="ddot" style="background:${d.color}"></span> ${esc(docLabel(d))}</td><td>${L.filter(a => a.status !== 'cancelled').length}</td><td>${at2}</td><td>${ns2}</td><td>${at2 + ns2 ? Math.round(ns2 / (at2 + ns2) * 100) + '%' : '—'}</td></tr>`; }).join('');
  return `<div class="p-head"><h2>Aylık rapor · ${ymLabel(P.rm)}</h2>
      <button class="nav-btn" data-act="rmMove" data-d="-1" aria-label="Önceki ay" ${P.rm <= minYm ? 'disabled' : ''}>‹</button>
      <button class="ghost" data-act="rmNow">Bu ay</button>
      <button class="nav-btn" data-act="rmMove" data-d="1" aria-label="Sonraki ay" ${P.rm >= cur ? 'disabled' : ''}>›</button></div>
    <p class="explain">${ongoing ? `Ay devam ediyor: ${m.up} randevu henüz gerçekleşmedi. ` : ''}Gelmeme oranı, gerçekleşmesi gereken randevular içinde gelinmeyenlerin payıdır.</p>
    <div class="kpis">
      <div class="kpi"><small>Randevu</small><b>${m.live.length}</b><span>${delta(m.live.length, prev.live.length)}</span></div>
      <div class="kpi"><small>Gelen hasta</small><b>${m.att}</b><span>${m.cx} iptal</span></div>
      <div class="kpi"><small>Gelmeme oranı</small><b>${m.nsRate === null ? '—' : m.nsRate + '%'}</b><span>${m.ns} randevuya gelinmedi</span></div>
      <div class="kpi"><small>Yeni hasta</small><b>${m.newP}</b><span>ilk kez randevu alan</span></div>
      <div class="kpi"><small>Yorum isteği</small><b>${m.reviews}</b><span>gelen hastaya gönderildi</span></div>
    </div>
    <div class="rgrid">
      <div class="rbox"><h3>Randevular nereden geldi?</h3>
        ${ch.map(([l, n]) => `<div class="hbar"><span>${l}</span><span class="tr" title="${l}: ${n} randevu"><i style="width:${n / chMax * 100}%"></i></span><b>${n} · ${Math.round(n / chTot * 100)}%</b></div>`).join('')}

function waText(text) {
  const s = text.toLocaleLowerCase('tr').trim();
  const exp = W.expect; W.expect = null;
  if (exp === 'name') {
    const n = text.trim().replace(/\s+/g, ' ');
    if (n.length < 2 || n.length > 80 || !/\p{L}/u.test(n) || /\d/.test(n)) return waSay('Lütfen ad ve soyadınızı yazın.', [], 'name');
    W.ctx.name = n; return waKvkk();
  }
  if (exp === 'slot') {
    const m = s.match(/\b(\d{1,2})[:.](\d{2})\b/);
    if (m) {
      const want = `${pad(Number(m[1]))}:${m[2]}`;
      const f = daySlots(docById(W.ctx.doc), W.ctx.ds).find(x => x.state === 'free' && hm(x.s) === want);
      if (f) { W.ctx.slot = f.s; return waName(); }
      waSay(`${want} dolu ya da çalışma saati dışında.`);
      return waSlots(W.ctx.ds);
    }
  }
  if (/^(menü|menu|ana menü|başa dön)/.test(s)) return waMenu();
  if (/iptal|gelemeyece|ertele/.test(s)) return waMine();
  if (/randevu|muayene|kontrol|müsait|boş saat|yer var/.test(s)) return waDoc();
  if (/ağrı|ağrıyor|sızı|şiş|kanama|kanıyor|acil|kırıl|apse/.test(s)) return waPain();
  if (/fiyat|ücret|kaç para|ne kadar tut|taksit/.test(s)) return waPrice();
  if (/adres|nerede|nerdesiniz|konum|yol tarifi|harita|otopark/.test(s)) return waAddr();
  if (/saat|açık mı|kaçta|kaça kadar|pazar|cumartesi|mesai/.test(s)) return waHours();
  if (/sekreter|yetkili|beni ara|arayın|arayabilir|görüşmek|insanla/.test(s)) return waHuman();
  if (/teşekkür|sağ ?ol|eyvallah|tamamdır/.test(s)) return waBye();
  if (/^(merhaba|selam|iyi günler|günaydın|iyi akşamlar|mrb|slm)/.test(s)) return waMenu('Merhaba! Size nasıl yardımcı olabilirim?');
  waSay('Bunu tam anlayamadım. Aşağıdakilerden birini seçebilir ya da sekreterimize bağlanabilirsiniz.', MENU());
}

      <a class="em-btn">Yol tarifi al</a><a class="em-btn alt">Randevuyu iptal et</a>`;
  if (m.type === 'review') body = `<h4>Ziyaretiniz için teşekkür ederiz</h4><p>Merhaba ${esc(first)}, bugün kliniğimize geldiğiniz için teşekkür ederiz. Deneyiminizi Google'da paylaşmak isterseniz aşağıdaki bağlantıyı kullanabilirsiniz. Görüşleriniz diğer hastalara yol gösterir.</p>
      <div class="stars" aria-hidden="true">★★★★★</div><a class="em-btn">Google'da değerlendir</a>`;
  return `<div class="em"><div class="em-meta"><div>Kimden: <b>${esc(c.name)}</b> &lt;randevu@${esc(c.domain)}&gt;</div><div>Kime: ${esc(m.to)}</div><div>Konu: <b>${esc(subj)}</b></div></div>
    <div class="em-card"><div class="em-top"><span class="mk">${TOOTH}</span>${esc(c.name)}</div><div class="em-body">${body}</div>
    <div class="em-foot">${esc(c.address)} · ${esc(c.phone)}<br>Bu e-postayı randevu alırken e-posta adresinizi paylaştığınız için aldınız.</div></div></div>`;
}

function waMsgHtml(m) {
  const a = S.appts.find(x => x.id === m.apptId), d = docById(a.doctorId), c = S.clinic, first = a.name.split(' ')[0];
  const txt = {
    confirm: `Merhaba ${first}, randevunuz oluşturuldu.\n*${docLabel(d)}*\n${fmtLong(a.start)}\nAdres: ${c.address}\nGelemeyecekseniz "iptal" yazmanız yeterli.`,
    reminder: `Merhaba ${first}, ${relDay(ymd(new Date(a.start))) === 'Yarın' ? 'yarın' : fmtDay(a.start)} saat ${hm(a.start)}'de ${docLabel(d)} ile randevunuz var.\nGelemeyecekseniz "iptal" yazmanız yeterli; saatiniz başka bir hastaya açılır.`,
    review: `Merhaba ${first}, bugün bizi tercih ettiğiniz için teşekkür ederiz. Deneyiminizi Google'da paylaşmak isterseniz: ${c.reviewUrl}`
  }[m.type];
  return `<div class="em"><div class="em-meta"><div>Kanal: <b>WhatsApp</b> · ${esc(c.name)}</div><div>Kime: <span class="tnum">${fmtPhone(m.to)}</span></div></div>
    <div class="wa-prev"><div class="wa-m bot"><span>${esc(txt).replace(/\*([^*\n]+)\*/g, '<b>$1</b>').replace(/\n/g, '<br>')}</span><small>${hm(m.at)}</small></div></div>
    <p class="hint" style="margin:8px 0 0">WhatsApp, işletmelerin ilk mesajlarını önceden onaylanmış şablonlarla gönderir; metin kurulumda kliniğinize göre düzenlenir.</p></div>`;
}

/* ------------------------------------------------------------- drawer */
function openDrawer(kind, id) {
  P.drawer = { kind, id };
  if (kind === 'new') P.na = { doc: S.doctors[0].id, date: P.tab === 'day' && P.day >= ymd(new Date()) ? P.day : ymd(new Date()), slot: '', name: '', phone: '', note: '', err: null };
  renderDrawer();
}
function closeDrawer() { P.drawer = null; P.na = null; renderDrawer(); }
function renderDrawer() {
  const root = $('#drawer-root');
  if (!P.drawer) { root.innerHTML = ''; return; }
  let title = '', body = '';
  if (P.drawer.kind === 'appt') {
    const a = S.appts.find(x => x.id === P.drawer.id); const d = docById(a.doctorId);
    title = 'Randevu detayı';
    const can = ['pending','confirmed'].includes(a.status);
    body = `<div><div style="font-size:20px;font-weight:800">${esc(a.name)}</div><div style="margin-top:4px">${pill(a.status)}</div></div>
      <div class="sum">
        <div><small>Hekim</small><b>${esc(docLabel(d))}</b></div>
        <div><small>Tarih</small><b>${fmtDay(a.start)}</b></div>
        <div><small>Saat</small><b class="tnum">${hm(a.start)} – ${hm(a.end)}</b></div>
        <div><small>E-posta</small><b>${a.email ? esc(a.email) : '—'}</b></div>
        <div><small>Not</small><b>${a.note ? esc(a.note) : '—'}</b></div>
        <div><small>Kaynak</small><b>${SRC_LONG[a.source] || 'Telefon (panel)'}</b></div>
        <div><small>KVKK onayı</small><b>${a.kvkkAt ? fmtLong(a.kvkkAt) + (a.source === 'whatsapp' ? ' (WhatsApp)' : '') : 'Sözlü (telefon)'}</b></div>
      </div>
      <div><small style="color:var(--ink-3);font-weight:600">Telefon</small>
        <div class="copy"><code>${fmtPhone(a.phone)}</code><button class="mini" data-act="copy" data-v="${fmtPhone(a.phone)}">Kopyala</button>
        <a class="mini pri" href="https://wa.me/${a.phone.slice(1)}" target="_blank" rel="noopener">WhatsApp</a></div></div>
      <div><small style="color:var(--ink-3);font-weight:600">Durumu değiştir</small>
        <div class="btn-row" style="margin-top:6px">
          ${a.status === 'pending' ? `<button class="mini pri" data-act="status" data-id="${a.id}" data-s="confirmed">Onayla</button>` : ''}
          <button class="mini ok" data-act="status" data-id="${a.id}" data-s="attended">Geldi</button>
          <button class="mini warn" data-act="status" data-id="${a.id}" data-s="no_show">Gelmedi</button>
          ${can ? `<button class="mini bad" data-act="status" data-id="${a.id}" data-s="cancelled">İptal et</button>` : ''}
          ${!can && a.status !== 'cancelled' ? `<button class="mini" data-act="status" data-id="${a.id}" data-s="confirmed">Geri al</button>` : ''}
        </div></div>
      ${a.status === 'attended' && (a.email || a.source === 'whatsapp') ? `<p class="note" style="margin:0">Google yorum isteği bu hastaya "Geldi" işaretinden 2 saat sonra ${a.source === 'whatsapp' ? 'WhatsApp\'tan' : 'e-postayla'} gönderilir.</p>` : ''}
      <button class="mini" data-act="patient" data-ph="${a.phone}" style="justify-self:start">Hasta kartını aç</button>`;
  } else if (P.drawer.kind === 'mail') {
    const m = S.mails.find(x => x.id === P.drawer.id);
    title = (m.channel === 'wa' ? 'WhatsApp · ' : '') + MAILT[m.type][1];
    body = m.channel === 'wa' ? waMsgHtml(m) : mailHtml(m);
  } else if (P.drawer.kind === 'patient') {
    title = 'Hasta kartı';
    body = patientHtml(P.drawer.id);
  } else {
    const n = P.na; const doc = docById(n.doc);
    const slots = daySlots(doc, n.date, true).filter(s => s.state === 'free');
    title = 'Telefonla gelen randevu';
    body = `<p class="explain" style="margin:0">Hasta aradığında randevuyu buradan girin. Aynı saat web sitesinde de hemen kapanır.</p>
      ${n.err ? `<div class="err" role="alert">${esc(n.err)}</div>` : ''}
      <form id="na-form" novalidate>
      <div class="field"><label for="na-doc">Hekim</label><select id="na-doc" data-na="doc">${S.doctors.map(d => `<option value="${d.id}" ${n.doc === d.id ? 'selected' : ''}>${esc(docLabel(d))}</option>`).join('')}</select></div>
      <div class="field"><label for="na-date">Tarih</label><input id="na-date" type="date" data-na="date" value="${n.date}" min="${ymd(new Date())}"></div>
      <div class="field"><label for="na-slot">Saat</label><select id="na-slot" data-na="slot">${slots.length ? `<option value="">Saat seçin</option>` + slots.map(s => `<option value="${s.s}" ${String(n.slot) === String(s.s) ? 'selected' : ''}>${hm(s.s)}</option>`).join('') : '<option value="">Bu gün boş saat yok</option>'}</select></div>
      <div class="field"><label for="na-name">Hasta adı</label><input id="na-name" data-na="name" value="${esc(n.name)}"></div>
      <div class="field"><label for="na-phone">Telefon</label><input id="na-phone" type="tel" data-na="phone" placeholder="05xx xxx xx xx" value="${esc(n.phone)}"></div>
      <div class="field"><label for="na-note">Not <small>(isteğe bağlı)</small></label><input id="na-note" data-na="note" value="${esc(n.note)}"></div>
      <button class="btn lg full" type="submit">Randevuyu kaydet</button></form>`;
  }
  root.innerHTML = `<div class="scrim" data-act="scrim"><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="dr-head"><b>${esc(title)}</b><button class="icon-btn" data-act="closeDrawer" aria-label="Kapat">×</button></div>
    <div class="dr-body">${body}</div></aside></div>`;
}

/* ------------------------------------------------------------ helpers */
function toast(msg, actionLabel, fn) {
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if (actionLabel) { const b = document.createElement('button'); b.textContent = actionLabel; b.onclick = () => { fn(); t.remove(); }; t.appendChild(b); }
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 5500);
}
function markPanelDot() { if (document.body.dataset.mode === 'site') $('#panel-dot').hidden = false; }
function store(k, v) { try { localStorage.setItem(KEY + ':' + k, v); } catch (e) {} }
function recall(k, d) { try { return localStorage.getItem(KEY + ':' + k) || d; } catch (e) { return d; } }
function setMode(v) {
  document.body.dataset.mode = v;
  $('#mode-site').setAttribute('aria-pressed', v === 'site'); $('#mode-panel').setAttribute('aria-pressed', v === 'panel');
  if (v === 'panel') { $('#panel-dot').hidden = true; renderPanel(); } else renderSite();
  store('mode', v);
}
function setDevice(v) {
  $('#frame').dataset.device = v;
  $('#dev-desktop').setAttribute('aria-pressed', v === 'desktop'); $('#dev-mobile').setAttribute('aria-pressed', v === 'mobile');
  store('device', v);
}
function showInPanel(a) { P.tab = 'day'; P.day = ymd(new Date(a.start)); P.flashId = a.id; setMode('panel'); window.scrollTo({ top: 0 }); }
function applyBrand() {
  document.documentElement.style.setProperty('--brand', S.clinic.color);
  document.documentElement.style.setProperty('--s-display', (FONTS[S.clinic.font] || FONTS.modern).css);
}
function renderAll() { applyBrand(); renderSite(); renderSheet(); renderPanel(); renderDrawer(); }

/* ------------------------------------------------------------- events */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if ((act === 'scrim' || act === 'sheetScrim') && e.target !== el) return;
  switch (act) {
    case 'mode': setMode(el.dataset.v); break;
    case 'device': setDevice(el.dataset.v); break;
    case 'reset': try { localStorage.removeItem(KEY); } catch (err) {} S = seed(); B = null; P.drawer = null; P.pq = ''; P.pf = 'all'; P.rm = ymOf(Date.now()); waReset(); P.day = ymd(new Date()); P.week = ymd(mondayOf(new Date())); P.tab = 'day'; renderAll(); toast('Demo başlangıç hâline döndü.'); break;
    case 'scrollTo': { const t = document.getElementById(el.dataset.t); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
    // hasta
    case 'book': openBooking(el.dataset.doc); break;
    case 'painZone': PM.zone = el.dataset.z; renderPain(); break;
    case 'painLv': PM.lv = Number(el.dataset.l); renderPain(); break;
    case 'quick': openBooking(el.dataset.doc); B.slot = Number(el.dataset.s); B.date = ymd(new Date(B.slot)); B.step = 4; renderSheet(); break;
    case 'close': case 'sheetScrim': closeSheet(); renderSite(); break;
    case 'back': B.err = null; B.step = Math.max(1, B.step - 1); renderSheet(); break;
    case 'pickDoc': if (B.doctorId !== el.dataset.doc) { B.date = null; B.slot = null; } B.doctorId = el.dataset.doc; B.step = 2; renderSheet(); break;
    case 'calMove': B.month = Math.max(0, Math.min(1, B.month + Number(el.dataset.d))); renderSheet(); break;
    case 'pickDate': if (B.date !== el.dataset.date) B.slot = null; B.date = el.dataset.date; B.err = null; B.step = 3; renderSheet(); break;
    case 'pickSlot': B.slot = Number(el.dataset.s); B.err = null; B.step = 4; renderSheet(); break;
    case 'kvkk': if (!B) B = { mode: 'kvkk', from: null }; else { B.from = B.mode; B.mode = 'kvkk'; } renderSheet(); break;
    case 'kvkkBack': if (B.from) { B.mode = B.from; renderSheet(); } else closeSheet(); break;
    case 'openCancel': B = { mode: 'cancel', token: el.dataset.token, confirm: false }; renderSheet(); break;
    case 'cancelAsk': B.confirm = true; renderSheet(); break;
    case 'cancelNo': B.confirm = false; renderSheet(); break;
    case 'doCancel': { const a = S.appts.find(x => x.token === B.token); setStatus(a.id, 'cancelled', 'patient'); renderSheet(); renderPanel(); break; }
    // panel
    case 'tab': P.tab = el.dataset.tab; renderPanel(); break;
    case 'dayMove': P.day = ymd(addDays(at(P.day, '12:00'), Number(el.dataset.d))); renderPanel(); break;
    case 'dayToday': P.day = ymd(new Date()); renderPanel(); break;
    case 'weekMove': P.week = ymd(addDays(at(P.week, '12:00'), 7 * Number(el.dataset.d))); renderPanel(); break;
    case 'weekToday': P.week = ymd(mondayOf(new Date())); renderPanel(); break;
    case 'docFilter': P.docFilter = el.dataset.doc; renderPanel(); break;
    case 'open': openDrawer('appt', el.dataset.id); break;
    case 'mail': openDrawer('mail', el.dataset.id); break;
    case 'newAppt': openDrawer('new'); break;
    case 'closeDrawer': case 'scrim': closeDrawer(); break;
    case 'status': {
      const a = S.appts.find(x => x.id === el.dataset.id);
      setStatus(a.id, el.dataset.s);
      P.flashId = a.id;
      renderPanel(); if (P.drawer) renderDrawer();
      if (el.dataset.s === 'attended' && a.email) toast(`${shortName(a.name)}: Google yorum isteği 2 saat sonra gönderilecek.`);
      else if (el.dataset.s === 'cancelled') toast('Randevu iptal edildi, saat web sitesinde yeniden açıldı.');
      break;
    }
    case 'noop': break;
    case 'pf': P.pf = el.dataset.f; renderPanel(); break;
    case 'patient': openDrawer('patient', el.dataset.ph); break;
    case 'called': markCalled(el.dataset.ph); renderPanel(); if (P.drawer) renderDrawer(); toast('Arandı olarak işaretlendi.'); break;
    case 'newFor': { const p = patients().find(x => x.phone === el.dataset.ph); openDrawer('new'); P.na.name = p ? p.name : ''; P.na.phone = fmtPhone(el.dataset.ph); renderDrawer(); break; }
    case 'exportCsv': exportCsv(); break;
    case 'rmMove': P.rm = shiftYm(P.rm, Number(el.dataset.d)); renderPanel(); break;
    case 'rmNow': P.rm = ymOf(Date.now()); renderPanel(); break;
    case 'waOpen': W.open = true; if (!W.started) waStart(); renderWa(); { const i = $('#wa-in'); if (i) i.focus({ preventScroll: true }); } break;
    case 'waClose': W.open = false; renderWa(); $('#wa-fab').focus({ preventScroll: true }); break;
    case 'waOpt': { const o = W.opts[Number(el.dataset.i)]; if (!o) break; waUser(o[0]); o[1](); break; }
    case 'offDel': S.timeOff = S.timeOff.filter(o => o.id !== el.dataset.id); save(); renderPanel(); toast('İzin kaldırıldı, saatler yeniden açıldı.'); break;
    case 'color': S.clinic.color = el.dataset.c; save(); applyBrand(); renderPanel(); break;
    case 'font': S.clinic.font = el.dataset.f; save(); applyBrand(); renderPanel(); break;
    case 'copy': {
      const v = el.dataset.v;
      const fallback = () => { const c = el.parentElement.querySelector('code'); const r = document.createRange(); r.selectNodeContents(c); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Numara seçildi, kopyalayabilirsiniz.'); };
      try { navigator.clipboard.writeText(v).then(() => toast('Numara kopyalandı.'), fallback); } catch (err) { fallback(); }
      break;
    }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (B && B.mode === 'book' && t.closest('#bk-form')) { if (t.name === 'kvkk') B.f.kvkk = t.checked; else if (t.name) B.f[t.name] = t.value; }
  if (t.dataset.set) {
    const k = t.dataset.set;
    S.clinic[k] = t.type === 'checkbox' ? t.checked : k === 'reminderHours' ? Number(t.value) : t.value;
    save(); applyBrand();
    if (k === 'name') { const pc = $('#p-clinic'); if (pc) pc.textContent = t.value; }
    if (k === 'color') document.querySelectorAll('.sw').forEach(s => s.setAttribute('aria-pressed', s.dataset.c.toLowerCase() === t.value.toLowerCase()));
  }
  if (t.dataset.pq) { P.pq = t.value; const l = $('#pt-list'); if (l) l.innerHTML = ptList(); }
  if (t.dataset.na && P.na) { P.na[t.dataset.na] = t.value; if (t.dataset.na === 'doc' || t.dataset.na === 'date') { P.na.slot = ''; renderDrawer(); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.change === 'slot') { docById(t.dataset.doc).slot = Number(t.value); save(); renderPanel(); toast('Randevu süresi güncellendi. Web sitesindeki saatler yeniden hesaplandı.'); }
  if (t.dataset.change === 'sat') { const d = docById(t.dataset.doc); if (t.checked) d.hours[6] = [['10:00','14:00']]; else delete d.hours[6]; save(); renderPanel(); }
  if (t.dataset.set === 'reminderHours' || t.dataset.set === 'autoConfirm') renderPanel();
});
// Formlar: claude.ai gibi formu engelleyen gömülü görünümlerde de çalışsın diye
// gönderim submit olayına bırakılmaz; Enter ve gönder düğmesi doğrudan yakalanır.
function onFormSubmit(e) {
  e.preventDefault();
  if (e.target.id === 'bk-form') {
    const r = book({ doctorId: B.doctorId, start: B.slot, ...B.f, source: 'web' });
    if (r.err) {
      B.err = ERR[r.err];
      if (r.err === 'SLOT_TAKEN' || r.err === 'SLOT_UNAVAILABLE') { B.slot = null; B.step = 3; }
      renderSheet(); return;
    }
    B = { mode: 'done', apptId: r.a.id };
    renderSheet(); renderPanel();
    toast(`Yeni web randevusu: ${shortName(r.a.name)} · ${fmtLong(r.a.start)}`, 'Panelde göster', () => showInPanel(r.a));
    markPanelDot();
  }
  if (e.target.id === 'wa-form') {
    const i = $('#wa-in'), v = i.value.trim(); if (!v) return;
    i.value = ''; waUser(v); waText(v); const ni = $('#wa-in'); if (ni) ni.focus({ preventScroll: true }); return;
  }
  if (e.target.id === 'off-form') {
    const ds = $('#off-date').value; if (!ds) return;
    const [a, b] = $('#off-span').value.split('-');
    S.timeOff.push({ id: uid(), doctorId: $('#off-doc').value || null, start: at(ds, a).getTime(), end: at(ds, b).getTime(), reason: $('#off-reason').value.trim() });
    save(); renderPanel(); toast('Kapatıldı. Bu saatler web sitesinde artık seçilemez.');
  }
  if (e.target.id === 'na-form') {
    const n = P.na;
    if (!n.slot) { n.err = 'Lütfen bir saat seçin.'; renderDrawer(); return; }
    const r = book({ doctorId: n.doc, start: Number(n.slot), name: n.name, phone: n.phone, note: n.note, source: 'panel' });
    if (r.err) { n.err = ERR[r.err]; renderDrawer(); return; }
    closeDrawer(); P.tab = 'day'; P.day = ymd(new Date(r.a.start)); P.flashId = r.a.id; renderPanel();
    toast(`Randevu kaydedildi: ${shortName(r.a.name)} · ${fmtLong(r.a.start)}`);
  }
}
document.addEventListener('submit', e => onFormSubmit(e));
document.addEventListener('click', e => {
  const btn = e.target.closest('button[type="submit"]');
  if (!btn || !btn.form) return;
  e.preventDefault();
  onFormSubmit({ target: btn.form, preventDefault() {} });
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key !== 'Enter' || e.isComposing || !t.form || t.tagName !== 'INPUT' || ['checkbox', 'radio', 'button', 'submit'].includes(t.type)) return;
  e.preventDefault();
  onFormSubmit({ target: t.form, preventDefault() {} });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (P.drawer) closeDrawer(); else if (B) closeSheet(); else if (W.open) { W.open = false; renderWa(); } } });

setInterval(() => {
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  if (document.body.dataset.mode === 'panel') renderPanel(); else if (!B) renderSite();
}, 60000);

load();
applyBrand();
setDevice(recall('device', window.matchMedia('(max-width:700px)').matches ? 'mobile' : 'desktop'));
setMode(recall('mode', 'site'));
renderSheet();
$('#wa-fab').innerHTML = ICON.wa + '<span>WhatsApp</span>';
renderWa();
window.demo = { get S() { return S; }, set S(v) { S = v; }, P, setMode, setDevice, openBooking, renderAll, renderSheet, get B() { return B; }, set B(v) { B = v; }, seed, W, patients, monthStats };
})();
</script>
