<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Örnek Diş Kliniği Demosu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Nunito:wght@700;800&display=swap">
<style>
:root{
  --brand:#0E7490;
  --bg:#E9F0F1; --surface:#FFFFFF; --surface-2:#F4F8F9; --ink:#10272E; --ink-2:#4A6168; --ink-3:#7A8F95; --line:#D8E3E6;
  --frame:#1B2B30;
  --ok:#15803D; --ok-soft:#DCFCE7; --warn:#B45309; --warn-soft:#FEF3C7; --bad:#B91C1C; --bad-soft:#FEE2E2;
  --info:#1D4ED8; --info-soft:#DBEAFE; --muted-soft:#E7EDEF;
  --brand-text:var(--brand);
  --brand-soft:color-mix(in srgb, var(--brand) 12%, var(--surface));
  --brand-softer:color-mix(in srgb, var(--brand) 6%, var(--surface));
  --shadow:0 1px 2px rgba(16,39,46,.06), 0 10px 30px rgba(16,39,46,.08);
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display:"Bricolage Grotesque", "Manrope", system-ui, sans-serif;
  --s-display:var(--display);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#081113; --surface:#101D21; --surface-2:#0C171A; --ink:#E3EDEF; --ink-2:#A2B5BA; --ink-3:#6C8288; --line:#22363C;
    --frame:#000;
    --ok:#4ADE80; --ok-soft:#10301D; --warn:#FBBF24; --warn-soft:#382909; --bad:#F87171; --bad-soft:#3A1414;
    --info:#93C5FD; --info-soft:#14244A; --muted-soft:#1A2A2F;
    --brand-text:color-mix(in srgb, var(--brand) 55%, #fff);
    --brand-soft:color-mix(in srgb, var(--brand) 26%, var(--surface));
    --brand-softer:color-mix(in srgb, var(--brand) 12%, var(--surface));
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#081113; --surface:#101D21; --surface-2:#0C171A; --ink:#E3EDEF; --ink-2:#A2B5BA; --ink-3:#6C8288; --line:#22363C;
  --frame:#000;
  --ok:#4ADE80; --ok-soft:#10301D; --warn:#FBBF24; --warn-soft:#382909; --bad:#F87171; --bad-soft:#3A1414;
  --info:#93C5FD; --info-soft:#14244A; --muted-soft:#1A2A2F;
  --brand-text:color-mix(in srgb, var(--brand) 55%, #fff);
  --brand-soft:color-mix(in srgb, var(--brand) 26%, var(--surface));
  --brand-softer:color-mix(in srgb, var(--brand) 12%, var(--surface));
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{font-family:var(--body);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- demo shell ---------- */
.shell{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bar-title{display:flex;flex-direction:column;gap:1px;margin-right:auto;min-width:0}
.bar-title b{font-size:15px;font-weight:800;letter-spacing:-.01em}
.bar-title span{color:var(--ink-2);font-size:13px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-weight:700;font-size:13px;color:var(--ink-2);position:relative;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg .dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-weight:600;font-size:13px;color:var(--ink-2)}
.ghost:hover{color:var(--ink);border-color:var(--ink-3)}
body[data-mode="panel"] #device-seg{display:none}
body[data-mode="site"] #view-panel,body[data-mode="panel"] #view-site{display:none}

/* site frame: desktop browser or phone */
.site-frame{position:relative;background:var(--surface);box-shadow:var(--shadow)}
.site-frame[data-device="desktop"]{max-width:1240px;margin-inline:auto;border:1px solid var(--line);border-radius:14px;overflow:clip}
.browser{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.browser i{width:11px;height:11px;border-radius:50%;background:var(--line);display:inline-block}
.browser .dots{display:flex;gap:6px}
.browser .url{flex:1;max-width:420px;margin-inline:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-size:12.5px;color:var(--ink-2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.browser .url b{color:var(--ink);font-weight:600}
.site-frame[data-device="mobile"]{width:390px;max-width:100%;height:min(812px, calc(100vh - 110px));min-height:560px;margin-inline:auto;border:10px solid var(--frame);border-radius:42px;overflow:hidden}
.site-frame[data-device="mobile"] .browser{display:none}
.site-frame[data-device="mobile"] .site{height:100%;overflow-y:auto;overscroll-behavior:contain}
.site{background:var(--surface);container-type:inline-size;container-name:site}
.sheet-scrim{position:fixed;inset:0;z-index:50;background:rgba(5,15,18,.5);display:grid;place-items:center;padding:16px}
.site-frame[data-device="mobile"] .sheet-scrim{position:absolute;padding:0;background:transparent}
.sheet{width:min(460px,100%);height:min(740px,calc(100vh - 32px));background:var(--surface);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);animation:up .22s ease-out}
.site-frame[data-device="mobile"] .sheet{width:100%;height:100%;border-radius:0;box-shadow:none}
@media (max-width:700px){
  #device-seg{display:none!important}
  .site-frame[data-device]{width:auto;height:auto;min-height:0;border:1px solid var(--line);border-radius:14px}
  .site-frame[data-device] .browser{display:none}
  .site-frame[data-device] .site{height:auto;overflow:visible}
  .site-frame[data-device] .sheet-scrim{position:fixed;padding:0;background:transparent}
  .site-frame[data-device] .sheet{width:100%;height:100%;border-radius:0}
}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.toast{animation:none}.flash{animation:none!important}}

/* ---------- patient site ---------- */
.s-in{max-width:1080px;margin-inline:auto}
.s-head{position:sticky;top:0;z-index:5;background:color-mix(in srgb, var(--surface) 90%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 18px}
.site-frame[data-device="desktop"] .s-head{top:env(safe-area-inset-top,0px)}
.s-head .s-in{display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--s-display);font-weight:700;font-size:17px;letter-spacing:-.01em;min-width:0;margin-right:auto}
.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo .mark{flex:none;width:32px;height:32px;border-radius:10px;background:var(--brand);display:grid;place-items:center}
.logo .mark svg{width:19px;height:19px;fill:#fff}
.s-nav{display:none;gap:4px}
.s-nav button{border:0;background:none;padding:7px 10px;border-radius:8px;font-weight:600;color:var(--ink-2)}
.s-nav button:hover{color:var(--ink);background:var(--surface-2)}
.s-phone{display:none;font-weight:700;color:var(--ink-2);font-size:13.5px}
.btn{border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;padding:9px 14px;font-size:13.5px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{filter:brightness(1.08)}
.btn.lg{padding:14px 20px;font-size:15px;border-radius:12px}
.btn.full{width:100%}
.btn.sec{background:var(--brand-soft);color:var(--brand-text)}
.btn.line{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

.s-hero{padding:30px 18px 28px;background:linear-gradient(180deg,var(--brand-softer),var(--surface))}
.s-hero-in{display:grid;gap:22px;align-items:start}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text);margin:0 0 10px}
.s-hero h1{font-family:var(--s-display);font-size:31px;line-height:1.07;letter-spacing:-.02em;margin-bottom:12px}
.s-hero p.sub{color:var(--ink-2);margin:0 0 20px;font-size:15px;max-width:48ch}
.cta{display:flex;gap:8px;flex-wrap:wrap}
.cta .btn{flex:1 1 auto}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact small{display:block;color:var(--ink-3);font-size:11.5px;font-weight:600}
.fact b{font-size:13.5px}
.quick{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.quick-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.quick-h b{font-size:15px}
.quick-h small{color:var(--ok);font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.quick-h small::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.qrow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.qrow b{display:block;font-size:13.5px}
.qrow small{color:var(--ink-2);font-size:12px}
.qslot{border:1.5px solid var(--brand);color:var(--brand-text);background:var(--surface);border-radius:10px;padding:6px 10px;font-weight:800;font-size:12.5px;text-align:center;line-height:1.2}
.qslot span{display:block;font-weight:600;font-size:11px;color:var(--ink-2)}
.qslot:hover{background:var(--brand-softer)}

.s-sec{padding:30px 18px;border-top:1px solid var(--line)}
.s-sec h2{font-family:var(--s-display);font-size:23px;letter-spacing:-.015em;margin-bottom:4px}
.s-sec p.lead{color:var(--ink-2);margin:0 0 16px;font-size:14px;max-width:60ch}
.svc{display:grid;gap:10px}
.svc div{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.svc b{display:block;font-size:15px;margin-bottom:2px}
.svc span{color:var(--ink-2);font-size:13px}
.docs{display:grid;gap:12px}
.doc{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;flex:none}
.av.sm{width:38px;height:38px;font-size:13px}
.doc h3{font-size:15.5px;font-weight:800}
.doc .spec{color:var(--brand-text);font-weight:700;font-size:12.5px}
.doc p{margin:6px 0 12px;color:var(--ink-2);font-size:13px}
.s-contact{display:grid;gap:18px}
.hours{width:100%;border-collapse:collapse;font-size:14px}
.hours td{padding:8px 0;border-bottom:1px dashed var(--line)}
.hours td:last-child{text-align:right;font-weight:700}
.contact{display:grid;gap:10px}
.contact div{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.contact small{color:var(--ink-3);font-weight:600}
.contact a{color:var(--brand-text);font-weight:700;text-decoration:none}
.s-foot{padding:20px 18px;background:var(--surface-2);border-top:1px solid var(--line);color:var(--ink-3);font-size:12px}
.s-foot .s-in{display:grid;gap:6px}
.link{background:none;border:0;padding:0;color:var(--brand-text);font-weight:700;text-decoration:underline;text-underline-offset:2px}

@container site (min-width: 760px){
  .s-head{padding:14px 28px}
  .s-nav,.s-phone{display:flex}
  .s-hero{padding:56px 28px 56px}
  .s-hero-in{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:center}
  .s-hero h1{font-size:50px}
  .s-hero p.sub{font-size:16.5px}
  .cta .btn{flex:0 0 auto}
  .facts{grid-template-columns:repeat(3,1fr);max-width:520px}
  .s-sec{padding:48px 28px}
  .s-sec h2{font-size:30px}
  .svc{grid-template-columns:repeat(3,1fr)}
  .docs{grid-template-columns:repeat(3,1fr)}
  .doc{grid-template-columns:1fr}
  .s-contact{grid-template-columns:1fr 1fr;gap:48px}
  .s-foot{padding:24px 28px}
}

/* booking sheet */
.sh-head{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.sh-head b{text-align:center;font-size:14.5px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2);font-size:20px;line-height:1}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px 16px 4px;margin:0;list-style:none}
.steps li{font-size:11px;font-weight:700;color:var(--ink-3);display:grid;gap:5px}
.steps li::before{content:"";height:4px;border-radius:4px;background:var(--line)}
.steps li.on{color:var(--ink)}
.steps li.on::before,.steps li.past::before{background:var(--brand)}
.sh-body{flex:1;overflow-y:auto;padding:14px 16px 20px}
.sh-body h3{font-size:18px;font-weight:800;letter-spacing:-.01em;margin-bottom:12px}
.pick{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.opt:hover{border-color:var(--ink-3)}
.opt.sel{border-color:var(--brand);background:var(--brand-softer)}
.opt b{display:block;font-size:14.5px}
.opt small{color:var(--ink-2);font-size:12.5px}
.opt .chev{color:var(--ink-3);font-size:18px}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:11px;font-weight:700;color:var(--ink-3);text-align:center;padding-bottom:2px}
.day{aspect-ratio:1/1.05;border:1.5px solid var(--line);border-radius:11px;background:var(--surface);display:grid;place-content:center;text-align:center;padding:0}
.day b{font-size:15px;line-height:1.1}
.day i{font-style:normal;font-size:10px;color:var(--ok);font-weight:700}
.day:disabled{background:var(--surface-2);border-color:transparent;color:var(--ink-3);cursor:default}
.day:disabled i{color:var(--ink-3)}
.day.today b{text-decoration:underline;text-underline-offset:3px}
.day.sel{border-color:var(--brand);background:var(--brand);color:#fff}
.day.sel i{color:#fff}
.slot-g{margin-bottom:14px}
.slot-g small{display:block;font-weight:700;color:var(--ink-3);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{padding:10px 0;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums}
.slot:hover:not(:disabled){border-color:var(--brand)}
.slot.sel{background:var(--brand);border-color:var(--brand);color:#fff}
.slot:disabled{background:var(--surface-2);border-color:transparent;color:var(--ink-3);text-decoration:line-through;cursor:default}
.ctx{background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--ink-2)}
.ctx b{color:var(--ink)}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-weight:700;font-size:13px}
.field label small{font-weight:600;color:var(--ink-3)}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px}
.field textarea{resize:vertical;min-height:64px;font-size:14px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand)}
.hint{color:var(--ink-3);font-size:12px}
.check{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;font-size:12.5px;color:var(--ink-2);margin:4px 0 14px}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--brand)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-weight:700;font-size:13px;margin-bottom:12px}
.done{text-align:center;padding-top:14px}
.done .ok-ic{width:62px;height:62px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px;font-size:30px;font-weight:800}
.done h3{font-size:21px}
.sum{margin:16px 0;text-align:left;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.sum div:last-child{border-bottom:0}
.sum small{color:var(--ink-3);font-weight:600}
.sum b{text-align:right}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px;text-align:left;margin:0 0 14px}
.stack{display:grid;gap:8px}
.kvkk-text{font-size:13px;color:var(--ink-2);display:grid;gap:10px}
.kvkk-text p{margin:0}

/* ---------- panel ---------- */
.panel{max-width:1240px;margin-inline:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.p-top{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.p-id{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.p-id .mark{flex:none;width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center}
.p-id .mark svg{width:19px;height:19px;fill:#fff}
.p-id b{display:block;font-size:15px;font-weight:800}
.p-id small{color:var(--ink-3);font-size:12px}
.p-nav{display:flex;gap:2px;padding:6px 10px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--surface-2)}
.p-nav button{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--ink-2);white-space:nowrap}
.p-nav button:hover{color:var(--ink)}
.p-nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.p-nav .cnt{display:inline-block;margin-left:5px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--brand);color:#fff;font-size:11px;line-height:18px}
.p-body{padding:18px 20px 24px}
.p-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.p-head h2{font-size:19px;font-weight:800;letter-spacing:-.01em;margin-right:auto}
.nav-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:16px;color:var(--ink-2)}
.nav-btn:hover:not(:disabled){color:var(--ink);border-color:var(--ink-3)}
.nav-btn:disabled{opacity:.4;cursor:default}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.stat{display:flex;align-items:baseline;gap:6px;padding:7px 11px;border-radius:9px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2);font-weight:600}
.stat b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.list{display:grid;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.now{box-shadow:inset 3px 0 0 var(--brand)}

<script>
(() => {
'use strict';
const KEY = 'ornek-dis-demo-v2';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const at = (ds, t) => { const [y,m,d] = ds.split('-').map(Number); const [h,mi] = t.split(':').map(Number); return new Date(y, m-1, d, h, mi, 0, 0); };
const hm = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const isoDow = d => ((d.getDay() + 6) % 7) + 1;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const midnight = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const mondayOf = d => addDays(midnight(d), -(isoDow(d) - 1));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const DAYS = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const DAYS_S = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const fmtDay = ms => { const d = new Date(ms); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${DAYS[isoDow(d)-1]}`; };
const fmtLong = ms => `${fmtDay(ms)}, ${hm(ms)}`;
const fmtPhone = p => p ? `0${p.slice(3,6)} ${p.slice(6,9)} ${p.slice(9,11)} ${p.slice(11,13)}` : '';
const relDay = ds => { const n = new Date(); if (ds === ymd(n)) return 'Bugün'; if (ds === ymd(addDays(n, 1))) return 'Yarın'; if (ds === ymd(addDays(n, -1))) return 'Dün'; return ''; };
const docLabel = d => `${d.title} ${d.name}`;
const initials = n => n.split(' ').map(x => x[0]).join('').slice(0, 2).toLocaleUpperCase('tr');
const shortName = n => { const p = n.trim().split(/\s+/); return p.length > 1 ? `${p[0]} ${p[p.length-1][0]}.` : p[0]; };

const STATUS = { pending: 'Onay bekliyor', confirmed: 'Onaylı', attended: 'Geldi', no_show: 'Gelmedi', cancelled: 'İptal' };
const ERR = {
  SLOT_TAKEN: 'Bu saat az önce doldu. Lütfen başka bir saat seçin.',
  SLOT_UNAVAILABLE: 'Bu saat artık müsait değil. Lütfen başka bir saat seçin.',
  KVKK_REQUIRED: 'Devam etmek için aydınlatma metnini onaylayın.',
  INVALID_PHONE: 'Geçerli bir telefon numarası girin (05xx xxx xx xx).',
  INVALID_EMAIL: 'E-posta adresini kontrol edin ya da boş bırakın.',
  INVALID_NAME: 'Adınızı ve soyadınızı girin.',
  TOO_MANY_BOOKINGS: 'Bu numarayla zaten 2 aktif randevunuz var. Değişiklik için kliniği arayın.',
  OVERLAP: 'Bu hekimin o saatte başka randevusu var.',
  PAST: 'Geçmiş bir saate randevu girilemez.'
};
const SERVICES = [
  ['Muayene ve dolgu', 'Ağız içi muayene, gerekirse röntgen ve çürük tedavisi.'],
  ['Kanal tedavisi', 'Diş sinirine ulaşan iltihap veya çürüklerde uygulanan tedavi.'],
  ['Ortodonti', 'Diş ve çene düzensizliklerinde tel veya şeffaf plak tedavisi.'],
  ['Diş eti tedavisi', 'Diş eti kanaması ve çekilmesinde periodontal tedavi.'],
  ['İmplant', 'Eksik dişlerin yerine çene kemiğine yerleştirilen yapay kök.'],
  ['Diş taşı temizliği', 'Diş taşlarının ve renklenmelerin profesyonel temizliği.']
];
const PALETTE = ['#0E7490', '#1D4ED8', '#6D28D9', '#BE185D', '#B45309', '#15803D', '#1F2937'];
const FONTS = {
  modern:  { label: 'Modern',  css: '"Bricolage Grotesque", "Manrope", system-ui, sans-serif' },
  klasik:  { label: 'Klasik',  css: '"Newsreader", Georgia, "Times New Roman", serif' },
  yumusak: { label: 'Yumuşak', css: '"Nunito", "Manrope", system-ui, sans-serif' }
};
const TOOTH = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 3C4.7 3 3 5 3 7.6c0 2 .8 3.4 1.4 5 .6 1.7.8 3.6 1.3 5.6.4 1.7 1 2.8 2 2.8 1.3 0 1.5-2 1.8-3.6.2-1.3.6-2.4 1.5-2.4h2c.9 0 1.3 1.1 1.5 2.4.3 1.6.5 3.6 1.8 3.6 1 0 1.6-1.1 2-2.8.5-2 .7-3.9 1.3-5.6.6-1.6 1.4-3 1.4-5C21 5 19.3 3 16.8 3c-1.8 0-3 1-4.8 1S9 3 7.2 3z"/></svg>';

/* ------------------------------------------------------------------ state */
let S;
function seed() {
  const WEEK = [['09:00','12:30'],['13:30','18:00']];
  const mk = sat => { const h = {}; for (let i = 1; i <= 5; i++) h[i] = WEEK.map(r => [...r]); if (sat) h[6] = [['10:00','14:00']]; return h; };
  const st = {
    clinic: { name: 'Örnek Diş Kliniği', domain: 'ornekdis.com.tr', color: '#0E7490', font: 'modern', district: 'Kadıköy',
      phone: '0212 000 00 00', wa: '905320000000', address: 'Örnek Mah. Demo Cad. No:1, Kadıköy / İstanbul',
      reviewUrl: 'https://g.page/r/ornek-dis/review', reminderHours: 24, autoConfirm: true },
    doctors: [
      { id: 'd1', title: 'Uzm. Dt.', name: 'Ayşe Demir', spec: 'Ortodonti', color: '#9333EA', slot: 30,
        bio: 'Diş teli ve şeffaf plak tedavileri alanında çalışmaktadır.', hours: mk(true) },
      { id: 'd2', title: 'Dt.', name: 'Mehmet Kaya', spec: 'Genel Diş Hekimliği', color: '#EA580C', slot: 30,
        bio: 'Muayene, dolgu ve kanal tedavisi yapmaktadır.', hours: mk(true) },
      { id: 'd3', title: 'Dr. Dt.', name: 'Zeynep Arslan', spec: 'Periodontoloji', color: '#0891B2', slot: 45,
        bio: 'Diş eti tedavileri ve implant cerrahisi alanında çalışmaktadır.', hours: mk(false) }
    ],
    timeOff: [], appts: [], mails: []
  };
  const names = ['Selin Aydın','Burak Öztürk','Merve Yıldız','Hakan Çelik','Deniz Koç','Can Erdem','Gizem Polat','Oğuz Tan',
    'Ece Şahin','Kerem Aksoy','Buse Kurt','Emre Doğan','Nazlı Güneş','Tolga Arı','İrem Bulut','Serkan Uçar','Pelin Ateş','Mert Kılıç'];
  const tr = s => s.toLocaleLowerCase('tr').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c').replace(/\s+/g,'.');
  let r = 11, ni = 0;
  const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  const now = Date.now();
  for (let off = -1; off <= 6; off++) {
    const ds = ymd(addDays(new Date(), off));
    for (const doc of st.doctors) {
      for (const sl of rawSlots(doc, ds)) {
        if (rnd() > (off <= 1 ? 0.4 : 0.24)) continue;
        const name = names[ni++ % names.length];
        const phone = '+905' + String(300000000 + Math.floor(rnd() * 599999999)).slice(0, 9);
        const email = rnd() < .6 ? tr(name) + '@example.com' : null;
        const past = sl.e <= now;
        const status = past ? (rnd() < .88 ? 'attended' : 'no_show') : (rnd() < .06 ? 'cancelled' : 'confirmed');
        const source = rnd() < .7 ? 'web' : 'panel';
        const created = Math.min(sl.s - 86400000 * (1 + Math.floor(rnd() * 5)), now - 3600000);
        const a = { id: uid(), token: uid(), doctorId: doc.id, start: sl.s, end: sl.e, name, phone, email, note: null,
          status, source, createdAt: created, kvkkAt: source === 'web' ? created : null, attendedAt: status === 'attended' ? sl.e : null };
        st.appts.push(a);
        if (email) {
          st.mails.push({ id: uid(), type: 'confirm', apptId: a.id, to: email, at: created });
          if (status !== 'cancelled') st.mails.push({ id: uid(), type: 'reminder', apptId: a.id, to: email, at: Math.max(created, sl.s - 24 * 3600000) });
          if (status === 'attended') st.mails.push({ id: uid(), type: 'review', apptId: a.id, to: email, at: sl.e + 2 * 3600000 });
        }
      }
    }
  }
  const nextWed = addDays(mondayOf(new Date()), 9);
  st.timeOff.push({ id: uid(), doctorId: 'd3', start: at(ymd(nextWed), '13:00').getTime(), end: at(ymd(nextWed), '18:00').getTime(), reason: 'Kongre' });
  return st;
}
function rawSlots(doc, ds) {
  const out = [];
  for (const [a, b] of (doc.hours[isoDow(at(ds, '00:00'))] || [])) {
    let t = at(ds, a).getTime(); const end = at(ds, b).getTime(); const step = doc.slot * 60000;
    while (t + step <= end) { out.push({ s: t, e: t + step }); t += step; }
  }
  return out;
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw); } catch (e) { S = null; }
  if (!S || !S.clinic || !Array.isArray(S.appts)) S = seed();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const docById = id => S.doctors.find(d => d.id === id);

/* ----------------------------------------------------- booking rules
   Veritabanındaki get_available_slots / book_appointment ile aynı kurallar */
function daySlots(doc, ds, forPanel = false) {
  const now = Date.now(), lead = forPanel ? now : now + 60 * 60000, horizon = now + 60 * 86400000;
  return rawSlots(doc, ds).map(({ s, e }) => {
    let state = 'free';
    if (s < lead || s > horizon) state = 'past';
    else if (S.timeOff.some(o => (!o.doctorId || o.doctorId === doc.id) && o.start < e && o.end > s)) state = 'off';
    else if (S.appts.some(x => x.doctorId === doc.id && x.status !== 'cancelled' && x.start < e && x.end > s)) state = 'taken';
    return { s, e, state };
  });
}
function nextFree(doc) {
  for (let i = 0; i < 21; i++) { const f = daySlots(doc, ymd(addDays(new Date(), i))).find(x => x.state === 'free'); if (f) return f.s; }
  return null;
}
function normPhone(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (/^90\d{10}$/.test(d)) d = d.slice(2); else if (/^0\d{10}$/.test(d)) d = d.slice(1);
  return /^[2-5]\d{9}$/.test(d) ? '+90' + d : null;
}
function book({ doctorId, start, name, phone, email, note, kvkk, source }) {
  if (source === 'web' && !kvkk) return { err: 'KVKK_REQUIRED' };
  name = String(name || '').trim().replace(/\s+/g, ' ');
  if (name.length < 2 || name.length > 80) return { err: 'INVALID_NAME' };
  const p = normPhone(phone); if (!p) return { err: 'INVALID_PHONE' };
  email = String(email || '').trim().toLowerCase() || null;
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return { err: 'INVALID_EMAIL' };
  const doc = docById(doctorId);
  const slot = daySlots(doc, ymd(new Date(start)), source === 'panel').find(x => x.s === start);
  if (!slot) return { err: 'SLOT_UNAVAILABLE' };
  if (slot.state === 'taken') return { err: source === 'web' ? 'SLOT_TAKEN' : 'OVERLAP' };
  if (slot.state === 'past') return { err: source === 'web' ? 'SLOT_UNAVAILABLE' : 'PAST' };
  if (slot.state !== 'free') return { err: 'SLOT_UNAVAILABLE' };
  if (source === 'web' && S.appts.filter(a => a.phone === p && ['pending','confirmed'].includes(a.status) && a.start > Date.now()).length >= 2)
    return { err: 'TOO_MANY_BOOKINGS' };
  const now = Date.now();
  const a = { id: uid(), token: uid(), doctorId, start, end: slot.e, name, phone: p, email, note: String(note || '').trim() || null,
    status: source === 'web' && !S.clinic.autoConfirm ? 'pending' : 'confirmed', source, createdAt: now,
    kvkkAt: source === 'web' ? now : null, attendedAt: null };
  S.appts.push(a);
  if (email) {
    S.mails.push({ id: uid(), type: 'confirm', apptId: a.id, to: email, at: now });
    S.mails.push({ id: uid(), type: 'reminder', apptId: a.id, to: email, at: Math.max(now, start - S.clinic.reminderHours * 3600000) });
  }
  save();
  return { ok: true, a };
}
function setStatus(id, status, by = 'panel') {
  const a = S.appts.find(x => x.id === id); if (!a) return;
  a.status = status;
  if (status === 'attended') {
    a.attendedAt = Date.now();
    if (a.email && S.clinic.reviewUrl && !S.mails.some(m => m.apptId === a.id && m.type === 'review'))
      S.mails.push({ id: uid(), type: 'review', apptId: a.id, to: a.email, at: Date.now() + 2 * 3600000 });
  }
  if (status === 'cancelled') S.mails.forEach(m => { if (m.apptId === a.id && m.at > Date.now()) m.cancelled = true; });
  save();
  if (by === 'patient') {
    toast(`${shortName(a.name)} randevusunu iptal etti · ${fmtLong(a.start)}`, 'Panelde göster', () => showInPanel(a));
    markPanelDot();
  }
}

function pWeek() {

}

      <a class="em-btn alt">Takvimime ekle</a><p style="font-size:12.5px">Gelemeyecekseniz lütfen randevunuzu iptal edin; saatiniz başka bir hastaya açılsın.</p><a class="em-btn alt">Randevuyu iptal et</a>`;

}

/* ------------------------------------------------------------ helpers */
function toast(msg, actionLabel, fn) {
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if (actionLabel) { const b = document.createElement('button'); b.textContent = actionLabel; b.onclick = () => { fn(); t.remove(); }; t.appendChild(b); }
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 5500);
}
function markPanelDot() { if (document.body.dataset.mode === 'site') $('#panel-dot').hidden = false; }
function store(k, v) { try { localStorage.setItem(KEY + ':' + k, v); } catch (e) {} }
function recall(k, d) { try { return localStorage.getItem(KEY + ':' + k) || d; } catch (e) { return d; } }
function setMode(v) {
  document.body.dataset.mode = v;
  $('#mode-site').setAttribute('aria-pressed', v === 'site'); $('#mode-panel').setAttribute('aria-pressed', v === 'panel');
  if (v === 'panel') { $('#panel-dot').hidden = true; renderPanel(); } else renderSite();
  store('mode', v);
}
function setDevice(v) {
  $('#frame').dataset.device = v;
  $('#dev-desktop').setAttribute('aria-pressed', v === 'desktop'); $('#dev-mobile').setAttribute('aria-pressed', v === 'mobile');
  store('device', v);
}
function showInPanel(a) { P.tab = 'day'; P.day = ymd(new Date(a.start)); P.flashId = a.id; setMode('panel'); window.scrollTo({ top: 0 }); }
function applyBrand() {
  document.documentElement.style.setProperty('--brand', S.clinic.color);
  document.documentElement.style.setProperty('--s-display', (FONTS[S.clinic.font] || FONTS.modern).css);
}
function renderAll() { applyBrand(); renderSite(); renderSheet(); renderPanel(); renderDrawer(); }

/* ------------------------------------------------------------- events */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if ((act === 'scrim' || act === 'sheetScrim') && e.target !== el) return;
  switch (act) {
    case 'mode': setMode(el.dataset.v); break;
    case 'device': setDevice(el.dataset.v); break;
    case 'reset': try { localStorage.removeItem(KEY); } catch (err) {} S = seed(); B = null; P.drawer = null; P.day = ymd(new Date()); P.week = ymd(mondayOf(new Date())); P.tab = 'day'; renderAll(); toast('Demo başlangıç hâline döndü.'); break;
    case 'scrollTo': { const t = document.getElementById(el.dataset.t); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
    // hasta
    case 'book': openBooking(el.dataset.doc); break;
    case 'quick': openBooking(el.dataset.doc); B.slot = Number(el.dataset.s); B.date = ymd(new Date(B.slot)); B.step = 4; renderSheet(); break;
    case 'close': case 'sheetScrim': closeSheet(); renderSite(); break;
    case 'back': B.err = null; B.step = Math.max(1, B.step - 1); renderSheet(); break;
    case 'pickDoc': if (B.doctorId !== el.dataset.doc) { B.date = null; B.slot = null; } B.doctorId = el.dataset.doc; B.step = 2; renderSheet(); break;
    case 'calMove': B.month = Math.max(0, Math.min(1, B.month + Number(el.dataset.d))); renderSheet(); break;
    case 'pickDate': if (B.date !== el.dataset.date) B.slot = null; B.date = el.dataset.date; B.err = null; B.step = 3; renderSheet(); break;
    case 'pickSlot': B.slot = Number(el.dataset.s); B.err = null; B.step = 4; renderSheet(); break;
    case 'kvkk': if (!B) B = { mode: 'kvkk', from: null }; else { B.from = B.mode; B.mode = 'kvkk'; } renderSheet(); break;
    case 'kvkkBack': if (B.from) { B.mode = B.from; renderSheet(); } else closeSheet(); break;
    case 'openCancel': B = { mode: 'cancel', token: el.dataset.token, confirm: false }; renderSheet(); break;
    case 'cancelAsk': B.confirm = true; renderSheet(); break;
    case 'cancelNo': B.confirm = false; renderSheet(); break;
    case 'doCancel': { const a = S.appts.find(x => x.token === B.token); setStatus(a.id, 'cancelled', 'patient'); renderSheet(); renderPanel(); break; }
    // panel
    case 'tab': P.tab = el.dataset.tab; renderPanel(); break;
    case 'dayMove': P.day = ymd(addDays(at(P.day, '12:00'), Number(el.dataset.d))); renderPanel(); break;
    case 'dayToday': P.day = ymd(new Date()); renderPanel(); break;
    case 'weekMove': P.week = ymd(addDays(at(P.week, '12:00'), 7 * Number(el.dataset.d))); renderPanel(); break;
    case 'weekToday': P.week = ymd(mondayOf(new Date())); renderPanel(); break;
    case 'docFilter': P.docFilter = el.dataset.doc; renderPanel(); break;
    case 'open': openDrawer('appt', el.dataset.id); break;
    case 'mail': openDrawer('mail', el.dataset.id); break;
    case 'newAppt': openDrawer('new'); break;
    case 'closeDrawer': case 'scrim': closeDrawer(); break;
    case 'status': {
      const a = S.appts.find(x => x.id === el.dataset.id);
      setStatus(a.id, el.dataset.s);
      P.flashId = a.id;
      renderPanel(); if (P.drawer) renderDrawer();
      if (el.dataset.s === 'attended' && a.email) toast(`${shortName(a.name)}: Google yorum isteği 2 saat sonra gönderilecek.`);
      else if (el.dataset.s === 'cancelled') toast('Randevu iptal edildi, saat web sitesinde yeniden açıldı.');
      break;
    }
    case 'offDel': S.timeOff = S.timeOff.filter(o => o.id !== el.dataset.id); save(); renderPanel(); toast('İzin kaldırıldı, saatler yeniden açıldı.'); break;
    case 'color': S.clinic.color = el.dataset.c; save(); applyBrand(); renderPanel(); break;
    case 'font': S.clinic.font = el.dataset.f; save(); applyBrand(); renderPanel(); break;
    case 'copy': {
      const v = el.dataset.v;
      const fallback = () => { const c = el.parentElement.querySelector('code'); const r = document.createRange(); r.selectNodeContents(c); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Numara seçildi, kopyalayabilirsiniz.'); };
      try { navigator.clipboard.writeText(v).then(() => toast('Numara kopyalandı.'), fallback); } catch (err) { fallback(); }
      break;
    }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (B && B.mode === 'book' && t.closest('#bk-form')) { if (t.name === 'kvkk') B.f.kvkk = t.checked; else if (t.name) B.f[t.name] = t.value; }
  if (t.dataset.set) {
    const k = t.dataset.set;
    S.clinic[k] = t.type === 'checkbox' ? t.checked : k === 'reminderHours' ? Number(t.value) : t.value;
    save(); applyBrand();
    if (k === 'name') { const pc = $('#p-clinic'); if (pc) pc.textContent = t.value; }
    if (k === 'color') document.querySelectorAll('.sw').forEach(s => s.setAttribute('aria-pressed', s.dataset.c.toLowerCase() === t.value.toLowerCase()));
  }
  if (t.dataset.na && P.na) { P.na[t.dataset.na] = t.value; if (t.dataset.na === 'doc' || t.dataset.na === 'date') { P.na.slot = ''; renderDrawer(); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.change === 'slot') { docById(t.dataset.doc).slot = Number(t.value); save(); renderPanel(); toast('Randevu süresi güncellendi. Web sitesindeki saatler yeniden hesaplandı.'); }
  if (t.dataset.change === 'sat') { const d = docById(t.dataset.doc); if (t.checked) d.hours[6] = [['10:00','14:00']]; else delete d.hours[6]; save(); renderPanel(); }
  if (t.dataset.set === 'reminderHours' || t.dataset.set === 'autoConfirm') renderPanel();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'bk-form') {
    const r = book({ doctorId: B.doctorId, start: B.slot, ...B.f, source: 'web' });
    if (r.err) {
      B.err = ERR[r.err];
      if (r.err === 'SLOT_TAKEN' || r.err === 'SLOT_UNAVAILABLE') { B.slot = null; B.step = 3; }
      renderSheet(); return;
    }
    B = { mode: 'done', apptId: r.a.id };
    renderSheet(); renderPanel();
    toast(`Yeni web randevusu: ${shortName(r.a.name)} · ${fmtLong(r.a.start)}`, 'Panelde göster', () => showInPanel(r.a));
    markPanelDot();
  }
  if (e.target.id === 'off-form') {
    const ds = $('#off-date').value; if (!ds) return;
    const [a, b] = $('#off-span').value.split('-');
    S.timeOff.push({ id: uid(), doctorId: $('#off-doc').value || null, start: at(ds, a).getTime(), end: at(ds, b).getTime(), reason: $('#off-reason').value.trim() });
    save(); renderPanel(); toast('Kapatıldı. Bu saatler web sitesinde artık seçilemez.');
  }
  if (e.target.id === 'na-form') {
    const n = P.na;
    if (!n.slot) { n.err = 'Lütfen bir saat seçin.'; renderDrawer(); return; }
    const r = book({ doctorId: n.doc, start: Number(n.slot), name: n.name, phone: n.phone, note: n.note, source: 'panel' });
    if (r.err) { n.err = ERR[r.err]; renderDrawer(); return; }
    closeDrawer(); P.tab = 'day'; P.day = ymd(new Date(r.a.start)); P.flashId = r.a.id; renderPanel();
    toast(`Randevu kaydedildi: ${shortName(r.a.name)} · ${fmtLong(r.a.start)}`);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (P.drawer) closeDrawer(); else if (B) closeSheet(); } });

setInterval(() => {
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  if (document.body.dataset.mode === 'panel') renderPanel(); else if (!B) renderSite();
}, 60000);

load();
applyBrand();
setDevice(recall('device', window.matchMedia('(max-width:700px)').matches ? 'mobile' : 'desktop'));
setMode(recall('mode', 'site'));
renderSheet();
window.demo = { get S() { return S; }, set S(v) { S = v; }, P, setMode, setDevice, openBooking, renderAll, renderSheet, get B() { return B; }, set B(v) { B = v; }, seed };
})();
</script>
</body>
</html>
